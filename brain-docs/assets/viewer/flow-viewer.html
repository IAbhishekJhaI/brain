<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bump this when the viewer changes; the brain-docs skill re-copies older versions. -->
<meta name="brain-docs-viewer" content="1">
<title>Flow Viewer</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --panel2: #f0f0ec; --ink: #1c1c1e; --muted: #6a6a70;
  --line: #e2e1dc; --hover: #f0efe9; --sel: #e3ecfd; --accent: #2f6fde; --accent-ink: #ffffff;
  --edge: #a3a3a9; --mark: #ffe58a; --warn: #a85d00; --err: #c0362c; --info: #2f6fde;
  --c0: #2f6fde; --c1: #c2410c; --c2: #15803d; --c3: #7c3aed; --c4: #be185d; --c5: #0e7490; --c6: #a16207; --c7: #4b5563;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151517; --panel: #1d1d20; --panel2: #26262a; --ink: #ececee; --muted: #9a9aa2;
    --line: #33333a; --hover: #26262b; --sel: #1f3358; --accent: #6ea0ff; --accent-ink: #0b1220;
    --edge: #5f5f68; --mark: #6b5a12; --warn: #f0a050; --err: #ff7a6e; --info: #6ea0ff;
    --c0: #7aa7ff; --c1: #ff9a5c; --c2: #5ccf86; --c3: #b391ff; --c4: #ff7fb6; --c5: #4fc6dd; --c6: #e5b74a; --c7: #a0a6b0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151517; --panel: #1d1d20; --panel2: #26262a; --ink: #ececee; --muted: #9a9aa2;
  --line: #33333a; --hover: #26262b; --sel: #1f3358; --accent: #6ea0ff; --accent-ink: #0b1220;
  --edge: #5f5f68; --mark: #6b5a12; --warn: #f0a050; --err: #ff7a6e; --info: #6ea0ff;
  --c0: #7aa7ff; --c1: #ff9a5c; --c2: #5ccf86; --c3: #b391ff; --c4: #ff7fb6; --c5: #4fc6dd; --c6: #e5b74a; --c7: #a0a6b0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--panel2); padding: 1px 4px; border-radius: 4px; }
a { color: var(--accent); }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); height: 100vh; }
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
header h1 { font-size: 15px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--edge); margin-right: 5px; vertical-align: 1px; }
.status .dot.live { background: #2fae5c; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 4px 10px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.on { background: var(--sel); border-color: var(--accent); }
.btn:focus-visible, .row:focus-visible, .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#menuBtn { display: none; }

aside#side { overflow: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 12px 10px; }
.search { width: 100%; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit; }
.navh { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 6px 4px; }
.nav { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
.nav:hover { background: var(--hover); }
.nav.active { background: var(--sel); font-weight: 600; }
.nav .n { margin-left: auto; font-size: 11px; color: var(--muted); }
.pill { font-size: 11px; border-radius: 9px; padding: 0 6px; margin-left: auto; }
.pill.err { background: var(--err); color: #fff; }
.pill.warn { background: var(--warn); color: #fff; }
.pill.ok { color: var(--muted); }

main#main { overflow: auto; padding: 18px 22px 60px; min-width: 0; }
main h2 { margin: 0 0 4px; font-size: 20px; }
.sub { color: var(--muted); margin: 0 0 12px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 12px; }
.seg { display: inline-flex; }
.seg .btn { border-radius: 0; }
.seg .btn:first-child { border-radius: 7px 0 0 7px; }
.seg .btn:last-child { border-radius: 0 7px 7px 0; margin-left: -1px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

.banner { border: 1px solid var(--err); background: color-mix(in srgb, var(--err) 10%, var(--panel)); border-radius: 8px; padding: 10px 12px; margin: 10px 0 14px; }
.banner.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); }

ul.tree { list-style: none; margin: 0; padding-left: 20px; border-left: 1px dashed var(--line); margin-left: 7px; }
ul.tree.root { padding-left: 0; border-left: 0; margin-left: 0; }
.row { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 7px; padding: 3px 8px 3px 4px; border-radius: 6px; cursor: pointer; border-left: 3px solid var(--dc, var(--edge)); margin: 1px 0; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--sel); }
.row.hit { box-shadow: inset 0 0 0 1px var(--accent); }
.tw { width: 14px; flex: none; text-align: center; color: var(--muted); user-select: none; }
.tw.leaf { opacity: .35; }
.sym { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--dc, var(--ink)); }
.path { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: 13px; }
.note::before { content: "— "; }
.tag { font-size: 11px; border-radius: 9px; padding: 0 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.cond { border-color: var(--c6); color: var(--c6); }
.tag.async { border-color: var(--c3); color: var(--c3); }
.tag.bnd { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tag.eff { background: var(--panel2); }
.reflink { font-weight: 600; color: var(--accent); }
.recur { color: var(--muted); font-size: 12px; padding: 2px 26px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }

.graphbox { position: relative; height: calc(100vh - 230px); min-height: 380px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; touch-action: none; }
.graphbox svg { width: 100%; height: 100%; display: block; cursor: grab; }
.graphbox svg.drag { cursor: grabbing; }
.graphhint { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: var(--muted); pointer-events: none; }
svg text { font-family: var(--mono); }
.gnode { cursor: pointer; }
.gnode rect.box { fill: var(--panel); stroke: var(--dc, var(--edge)); stroke-width: 1.5; }
.gnode.sel rect.box { fill: var(--sel); stroke-width: 2.5; }
.gnode.bnd rect.box { stroke-dasharray: 5 3; }
.gnode.eff rect.box, .gnode.res rect.box { fill: var(--panel2); }
.gnode.res rect.box { stroke-dasharray: 2 3; }
.gnode .t1 { fill: var(--ink); font-size: 12px; font-weight: 600; }
.gnode .t2 { fill: var(--muted); font-size: 10.5px; }
.gedge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
.gedge.async { stroke-dasharray: 4 3; }
.glabel { fill: var(--c6); font-size: 10.5px; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; }
.cbox { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
.ctext { fill: var(--ink); font-size: 12.5px; font-weight: 600; font-family: system-ui, sans-serif; }
.clabel { fill: var(--muted); font-size: 11px; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; font-family: system-ui, sans-serif; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card b { display: block; margin-bottom: 3px; }
.card .meta { font-size: 12px; color: var(--muted); }
.ov-svg { width: 100%; height: auto; display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0 18px; }
.prose p { margin: 6px 0; }
.prose ul { margin: 6px 0; padding-left: 20px; }
h3 { font-size: 15px; margin: 22px 0 8px; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); padding: 6px 8px; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.mono { overflow-wrap: anywhere; }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 12px; padding: 0 8px; margin: 2px 4px 2px 0; font-size: 12px; cursor: pointer; background: var(--panel); }
.chip:hover { border-color: var(--accent); }

.lint { list-style: none; padding: 0; margin: 0; }
.lint li { display: flex; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.lint .sev { font-size: 11px; font-weight: 700; width: 44px; flex: none; text-transform: uppercase; }
.lint .sev.error { color: var(--err); } .lint .sev.warn { color: var(--warn); } .lint .sev.info { color: var(--info); }
.lint .ln { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }

section#details { width: 330px; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 14px 16px; }
section#details[hidden] { display: none; }
#details h3 { margin: 0 0 4px; font-family: var(--mono); font-size: 14px; overflow-wrap: anywhere; }
#details .k { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 14px 0 4px; }
#details .close { float: right; }

.empty { max-width: 560px; margin: 8vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 26px 28px; }
.empty h2 { margin-top: 0; }
.empty .acts { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.empty ul { color: var(--muted); padding-left: 18px; }
.dropping::after { content: "Drop flow.md to load it"; position: fixed; inset: 12px; border: 3px dashed var(--accent); border-radius: 16px; background: color-mix(in srgb, var(--accent) 12%, transparent); display: grid; place-items: center; font-size: 20px; font-weight: 600; color: var(--accent); z-index: 50; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  #menuBtn { display: inline-block; }
  aside#side { position: fixed; top: 49px; bottom: 0; left: 0; width: min(290px, 85vw); z-index: 20; transform: translateX(-102%); transition: transform .18s; box-shadow: 0 0 30px rgba(0,0,0,.2); }
  aside#side.open { transform: none; }
  main#main { padding: 14px 16px 60px; }
  ul.tree { padding-left: 10px; margin-left: 4px; }
  section#details { position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 55vh; z-index: 30; border-left: 0; border-top: 1px solid var(--line); box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
  .status { display: none; }
  .graphbox { height: 60vh; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="btn" id="menuBtn" aria-label="Toggle navigation">☰</button>
    <h1 id="docTitle">Flow Viewer</h1>
    <span class="status" id="status"></span>
    <span class="spacer"></span>
    <button class="btn" id="openBtn" title="Open flow.md">Open</button>
    <button class="btn" id="reloadBtn" title="Reload flow.md" hidden>Reload</button>
    <button class="btn" id="themeBtn" title="Theme">◐</button>
    <input type="file" id="fileInput" accept=".md,text/markdown,text/plain" hidden>
  </header>
  <aside id="side" aria-label="Navigation"></aside>
  <main id="main"></main>
  <section id="details" hidden aria-label="Node details"></section>
</div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants
const LIMITS = { note: 80, flowLines: 40, fileLines: 400, keyPaths: 3, keyRowChars: 160 };
const HISTORY_RE = /\[(?:CHANGED|NEW|REMOVED|DEPRECATED)\b[^\]]*\]|\b(?:previously|no longer|supersede[sd]?|formerly|used to|was|were|old|deleted|removed)\b|\b20\d\d-\d\d-\d\d\b/i;
const LEGACY_RE = /\[(?:CHANGED|NEW)\b[^\]]*\]/g;
const EFFECTS = ['db', 'ext', 'cache', 'queue', 'fs', 'env', 'log'];
const NS = 'http://www.w3.org/2000/svg';
const POLL_MS = 2000;
const IDB_KEY = 'handle:' + location.pathname;

// ---------------------------------------------------------------- dom helpers
const $ = (q) => document.querySelector(q);
function setAttrs(el, a) {
  if (!a) return;
  for (const k in a) {
    const v = a[k];
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
}
function append(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    el.append(k instanceof Node ? k : String(k));
  }
}
function h(tag, attrs, ...kids) { const el = document.createElement(tag); setAttrs(el, attrs); append(el, kids); return el; }
function s(tag, attrs, ...kids) { const el = document.createElementNS(NS, tag); setAttrs(el, attrs); append(el, kids); return el; }
function walk(nodes, fn) { for (const n of nodes) { fn(n); walk(n.children, fn); } }
function slug(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'flow'; }
function basename(p) { return p.split('/').pop(); }
function topDir(p) { return p && p.includes('/') ? p.split('/')[0] : (p ? '(root)' : ''); }

// Tiny inline markdown: `code` and **bold** only.
function inline(text) {
  const out = [];
  for (const part of text.split(/(`[^`]+`|\*\*[^*]+\*\*)/)) {
    if (!part) continue;
    if (part.startsWith('`') && part.endsWith('`') && part.length > 1) out.push(h('code', null, part.slice(1, -1)));
    else if (part.startsWith('**') && part.endsWith('**') && part.length > 3) out.push(h('strong', null, part.slice(2, -2)));
    else out.push(part);
  }
  return out;
}
function prose(lines) {
  const blocks = []; let cur = [];
  for (const l of lines) {
    const t = l.trim();
    if (t && !/^(-{3,}|\*{3,})$/.test(t)) cur.push(t);
    else if (cur.length) { blocks.push(cur); cur = []; }
  }
  if (cur.length) blocks.push(cur);
  return h('div', { class: 'prose' }, blocks.map(b => {
    if (b.every(l => /^[-*]\s/.test(l))) return h('ul', null, b.map(l => h('li', null, inline(l.replace(/^[-*]\s+/, '')))));
    if (b.every(l => l.startsWith('>'))) return h('p', { class: 'sub' }, inline(b.map(l => l.replace(/^>\s?/, '')).join(' ')));
    return h('p', null, inline(b.join(' ')));
  }));
}

// ---------------------------------------------------------------- parser
function parseNodeLine(body) {
  let async = false, cond = null, m;
  for (;;) {
    if (body.startsWith('~')) { async = true; body = body.slice(1).trim(); continue; }
    if ((m = body.match(/^\[if\s+([^\]]*)\]\s*/i))) { cond = m[1].trim(); body = body.slice(m[0].length); continue; }
    if ((m = body.match(/^\[else\]\s*/i))) { cond = 'else'; body = body.slice(m[0].length); continue; }
    break;
  }
  let note = '';
  const nm = body.match(/\s+(?:—|–|--)\s+(.*)$/);
  if (nm) { note = nm[1].trim(); body = body.slice(0, nm.index).trim(); }
  const n = { async, cond, note, kind: 'call', path: '', symbol: '', label: '', children: [] };
  if (body.startsWith('@')) { n.kind = 'ref'; n.target = body.slice(1).trim(); n.label = n.target; }
  else if ((m = body.match(/^=>\s*(.*)$/))) { n.kind = 'boundary'; n.label = m[1].trim(); }
  else if ((m = body.match(/^(?:→|->)\s*(.*)$/))) { n.kind = 'result'; n.label = m[1].trim(); }
  else if ((m = body.match(new RegExp('^(' + EFFECTS.join('|') + ')\\s*:\\s*(.*)$', 'i')))) { n.kind = 'effect'; n.effect = m[1].toLowerCase(); n.label = m[2].trim(); }
  else if ((m = body.match(/^(.*?)\s*::\s*(.*)$/))) { n.path = m[1].trim(); n.symbol = m[2].trim(); }
  else { n.symbol = body; }
  return n;
}

function parseDoc(text) {
  const lines = text.split(/\r?\n/);
  const doc = { title: '', intro: [], overview: null, flows: [], keyFiles: [], other: [], lint: [], lineCount: lines.length, raw: text, legacy: false };
  const lint = (sev, msg, line) => doc.lint.push({ sev, msg, line });
  let sec = null, fence = null;

  const closeFence = () => {
    const f = fence; fence = null;
    if (f.lang === 'flow') {
      if (!sec || sec.type !== 'flow') { lint('warn', 'A ```flow block sits outside a "## Flow:" section and was ignored', f.start); return; }
      parseFlowBlock(f, sec);
    } else if (f.lang === 'components') {
      if (!sec || sec.type !== 'overview') { lint('warn', 'A ```components block belongs under "## Overview"', f.start); return; }
      parseComponents(f, sec);
    } else if (sec && (sec.type === 'overview' || sec.type === 'other')) {
      sec.code.push(f.lines.map(l => l.text).join('\n'));
    }
  };

  const parseFlowBlock = (f, flow) => {
    flow.hasBlock = true;
    const stack = [];
    for (const { text: t, no } of f.lines) {
      const raw = t.replace(/\t/g, '  ');
      let body = raw.trim();
      if (!body || body.startsWith('#')) continue;
      body = body.replace(/\s+#\s.*$/, '').trim();
      if (!body) continue;
      flow.blockLines++;
      const indent = raw.match(/^ */)[0].length;
      if (indent % 2) lint('warn', 'Indent is not a multiple of 2 spaces', no);
      const n = parseNodeLine(body);
      n.line = no; n.raw = body;
      while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
      const top = stack[stack.length - 1];
      if (top && indent - top.indent > 2) lint('info', 'Indent jumps more than one level', no);
      n.parent = top ? top.node : null;
      n.depth = n.parent ? n.parent.depth + 1 : 0;
      if (n.kind === 'call' && !n.path) {
        let a = n.parent; while (a && !(a.kind === 'call' && a.path)) a = a.parent;
        if (a) { n.path = a.path; n.inherited = true; }
      }
      (n.parent ? n.parent.children : flow.roots).push(n);
      stack.push({ indent, node: n });
      if (n.note.length > LIMITS.note) lint('warn', `Note is ${n.note.length} chars (limit ${LIMITS.note}) — keep notes to what the hop does`, no);
      if (HISTORY_RE.test(body)) lint('warn', `History/changelog wording: "${body.match(HISTORY_RE)[0]}" — flow.md describes the current code only`, no);
    }
  };

  const parseComponents = (f, ov) => {
    for (const { text: t, no } of f.lines) {
      let l = t.replace(/\s+#\s.*$/, '').trim();
      if (!l || l.startsWith('#')) continue;
      const m = l.match(/^(.*?)\s*(<->|->|→)\s*(.*)$/);
      if (!m) { ov.nodes.push(l); continue; }
      let b = m[3], label = '';
      const lm = b.match(/^(.*?)\s*:\s*(.*)$/);
      if (lm) { b = lm[1]; label = lm[2]; }
      if (!m[1].trim() || !b.trim()) { lint('warn', 'Malformed components edge', no); continue; }
      ov.edges.push({ a: m[1].trim(), b: b.trim(), label: label.trim(), both: m[2] === '<->' });
    }
  };

  let inComment = false;
  const content = []; // lines under ## sections, minus comments — what legacy detection scans
  for (let i = 0; i < lines.length; i++) {
    let ln = lines[i]; const no = i + 1;
    if (fence) {
      if (/^\s*```+\s*$/.test(ln)) closeFence();
      else { fence.lines.push({ text: ln, no }); if (sec) content.push({ text: ln, no }); }
      continue;
    }
    // Strip <!-- html comments --> (template guidance) outside fences.
    if (inComment) { const e = ln.indexOf('-->'); if (e < 0) continue; ln = ln.slice(e + 3); inComment = false; }
    ln = ln.replace(/<!--.*?-->/g, '');
    const cs = ln.indexOf('<!--'); if (cs >= 0) { inComment = true; ln = ln.slice(0, cs); }
    if (sec) content.push({ text: ln, no });
    let m;
    if ((m = ln.match(/^\s*```+\s*([\w-]*)/))) { fence = { lang: m[1].toLowerCase(), start: no, lines: [] }; continue; }
    if ((m = ln.match(/^#\s+(.*)/)) && !doc.title) { doc.title = m[1].trim(); continue; }
    if ((m = ln.match(/^##\s+(.*)/))) {
      const head = m[1].trim(); let fm;
      if (/^overview\b/i.test(head)) { sec = { type: 'overview', title: head, text: [], code: [], edges: [], nodes: [], line: no }; doc.overview = sec; }
      else if ((fm = head.match(/^flow\s*:\s*(.*?)\s*(?:\{#([\w-]+)\})?\s*$/i))) {
        sec = { type: 'flow', name: fm[1] || 'Untitled', id: fm[2] || '', trigger: '', text: [], roots: [], blockLines: 0, line: no, hasBlock: false };
        if (!fm[2]) lint('info', `Flow "${sec.name}" has no {#id}; using #${slug(sec.name)}`, no);
        doc.flows.push(sec);
      }
      else if (/^key\s*files/i.test(head)) { sec = { type: 'keyfiles', line: no, header: false }; }
      else { sec = { type: 'other', title: head, text: [], code: [], line: no }; doc.other.push(sec); }
      continue;
    }
    if (!sec) { doc.intro.push(ln); continue; }
    if (sec.type === 'flow') {
      if ((m = ln.match(/^\s*trigger\s*:\s*(.*)/i))) { sec.trigger = m[1].trim(); sec.triggerLine = no; }
      else if (ln.trim()) sec.text.push(ln);
    } else if (sec.type === 'keyfiles') {
      if (!/^\s*\|/.test(ln)) continue;
      const cells = ln.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      if (cells.every(c => /^:?-+:?$/.test(c))) continue;
      if (!sec.header) { sec.header = true; continue; }
      const row = { concern: cells[0], files: cells.slice(1).join(' | '), line: no };
      doc.keyFiles.push(row);
      const paths = (row.files.match(/`[^`]+`/g) || []).length;
      if (paths > LIMITS.keyPaths) lint('warn', `Key files row "${row.concern}" lists ${paths} paths (limit ${LIMITS.keyPaths})`, no);
      if (row.files.length > LIMITS.keyRowChars) lint('warn', `Key files row "${row.concern}" reads like prose — paths only`, no);
      if (HISTORY_RE.test(ln)) lint('warn', `History/changelog wording in Key files: "${ln.match(HISTORY_RE)[0]}"`, no);
    } else {
      sec.text.push(ln);
    }
  }
  if (fence) lint('error', 'Unclosed code fence', fence.start);

  // ids, indexes, refs
  const seen = new Set();
  for (const f of doc.flows) {
    let id = f.id || slug(f.name);
    if (seen.has(id)) { lint('warn', `Duplicate flow id #${id}`, f.line); let k = 2; while (seen.has(id + '-' + k)) k++; id = id + '-' + k; }
    seen.add(id); f.id = id;
    if (!f.hasBlock) lint('warn', `Flow "${f.name}" has no \`\`\`flow block`, f.line);
    if (!f.trigger) lint('info', `Flow "${f.name}" has no "Trigger:" line`, f.line);
    if (f.blockLines > LIMITS.flowLines) lint('warn', `Flow "${f.name}" is ${f.blockLines} lines (budget ${LIMITS.flowLines}) — split a sub-flow out and link it with @id`, f.line);
    if (f.trigger && HISTORY_RE.test(f.trigger)) lint('warn', `History wording in trigger of "${f.name}"`, f.triggerLine);
  }
  doc.flowById = new Map(doc.flows.map(f => [f.id, f]));
  doc.nodes = new Map(); doc.files = new Map(); doc.refsTo = new Map(); doc.dirs = [];
  for (const f of doc.flows) {
    let i = 0;
    walk(f.roots, n => {
      n.id = f.id + ':' + (i++); n.flow = f; doc.nodes.set(n.id, n);
      if (n.kind === 'call' && n.path) {

        doc.files.get(n.path).push(n);
        const d = topDir(n.path); if (!doc.dirs.includes(d)) doc.dirs.push(d);
      }
      if (n.kind === 'ref') {
        n.targetFlow = doc.flowById.get(n.target) || null;
        if (!n.targetFlow) lint('error', `Broken reference @${n.target} — no flow with that id`, n.line);
        else { if (!doc.refsTo.has(n.target)) doc.refsTo.set(n.target, []); doc.refsTo.get(n.target).push(n); }
      }
    });
  }

  // legacy detection
  let legacyCount = 0, legacyLine = 0;
  for (const c of content) {
    const hits = c.text.match(LEGACY_RE);
    if (hits) { legacyCount += hits.length; legacyLine = legacyLine || c.no; }
  }
  if (legacyCount) {
    doc.legacy = true;
    lint('error', `${legacyCount} legacy [CHANGED]/[NEW] tags — this flow.md uses the old format. Ask Claude to "upgrade the brain flow doc".`, legacyLine);
  }
  if (!doc.flows.some(f => f.hasBlock)) {
    doc.legacy = true;
    lint('error', 'No "## Flow:" sections with ```flow blocks — this looks like the old format. Ask Claude to "upgrade the brain flow doc".', 1);
  }
  if (doc.lineCount > LIMITS.fileLines) lint('warn', `flow.md is ${doc.lineCount} lines (target ≤ ${LIMITS.fileLines}) — trim notes, split or merge flows`, 1);
  for (const o of doc.other) lint('info', `Section "${o.title}" is not part of the flow format (shown as text on Overview)`, o.line);
  const rank = { error: 0, warn: 1, info: 2 };
  doc.lint.sort((a, b) => rank[a.sev] - rank[b.sev] || a.line - b.line);
  return doc;
}

// ---------------------------------------------------------------- routing

// Text measurement for SVG layout.
const ctx = document.createElement('canvas').getContext('2d');

function clip(t, font, max) {
  if (textW(t, font) <= max) return t;

  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (textW(t.slice(0, mid) + '…', font) <= max) lo = mid; else hi = mid - 1; }
  return t.slice(0, lo) + '…';

function componentsSvg(ov) {

  const layer = names.map(() => 0);
  for (let it = 0; it < names.length; it++) {
    let changed = false;
    for (const e of ov.edges) {
      const a = idx.get(e.a), b = idx.get(e.b);
      if (a !== b && layer[b] < layer[a] + 1 && layer[a] + 1 < names.length) { layer[b] = layer[a] + 1; changed = true; }
    }
    if (!changed) break;
  }
  const FONT = '600 12.5px system-ui, sans-serif', BH = 38, GAPY = 26, GAPX = 90, PAD = 20;
  const cols = [];
  names.forEach((n, i) => { (cols[layer[i]] = cols[layer[i]] || []).push(i); });
  const w = names.map(n => Math.min(240, textW(n, FONT) + 28));
  const pos = []; let x = PAD, H = 0;
  const colH = cols.map(c => c ? c.length * BH + (c.length - 1) * GAPY : 0);
  const maxH = Math.max(...colH, BH);
  cols.forEach((c, ci) => {
    if (!c) return;
    const cw = Math.max(...c.map(i => w[i]));
    let y = PAD + (maxH - colH[ci]) / 2;
    for (const i of c) { pos[i] = { x: x + (cw - w[i]) / 2, y, w: w[i] }; y += BH + GAPY; }
    x += cw + GAPX;
  });

  const svg = s('svg', { class: 'ov-svg', viewBox: `0 0 ${W} ${H}`, style: `max-width:${Math.max(W, 320)}px`, role: 'img', 'aria-label': 'Component overview' });
  svg.append(s('defs', null, s('marker', { id: 'carr', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, s('path', { d: 'M0,0 L10,5 L0,10 z', style: 'fill:var(--edge)' }))));
  for (const e of ov.edges) {
    const a = pos[idx.get(e.a)], b = pos[idx.get(e.b)];
    let d, lx, ly;
    if (b.x > a.x + a.w) {
      const x1 = a.x + a.w, y1 = a.y + BH / 2, x2 = b.x, y2 = b.y + BH / 2, mx = (x1 + x2) / 2;
      d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`; lx = mx; ly = (y1 + y2) / 2 - 5;
    } else {
      const x1 = a.x + a.w / 2, y1 = a.y + BH, x2 = b.x + b.w / 2, y2 = b.y + BH, dy = 34;
      d = `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 + dy} ${x2},${y2}`; lx = (x1 + x2) / 2; ly = Math.max(y1, y2) + dy - 4;
    }
    svg.append(s('path', { d, class: 'gedge', 'marker-end': 'url(#carr)', 'marker-start': e.both ? 'url(#carr)' : null }));
    if (e.label) svg.append(s('text', { x: lx, y: ly, 'text-anchor': 'middle', class: 'clabel' }, e.label));
  }
  names.forEach((n, i) => {
    const p = pos[i];
    svg.append(s('rect', { x: p.x, y: p.y, width: p.w, height: BH, rx: 8, class: 'cbox' }),
      s('text', { x: p.x + p.w / 2, y: p.y + BH / 2 + 4.5, 'text-anchor': 'middle', class: 'ctext' }, clip(n, FONT, p.w - 16)));
  });
  return svg;
}

// ---- flow
function renderFlow(f) {
  const d = S.doc;
  const wrap = h('div', null, h('h2', null, f.name));
  if (f.trigger) wrap.append(h('p', { class: 'sub' }, h('strong', null, 'Trigger: '), inline(f.trigger)));

  const all = []; walk(f.roots, n => all.push(n));

    h('span', { class: 'seg' },

      h('button', { class: 'btn' + (S.mode === 'graph' ? ' on' : ''), onclick: () => { S.mode = 'graph'; render(); } }, 'Graph')),
    h('button', { class: 'btn', onclick: () => { all.forEach(n => S.collapsed.delete(n.id)); render(); } }, 'Expand all'),
    h('button', { class: 'btn', onclick: () => setDepth(1) }, 'Collapse all'),
    h('button', { class: 'btn', onclick: () => setDepth(2) }, 'Depth 2'),
    h('button', { class: 'btn', onclick: () => setDepth(3) }, 'Depth 3'),
    S.mode === 'graph' && h('button', { class: 'btn', onclick: () => { delete S.views[f.id]; S.fitExact = true; render(); } }, 'Fit')));
  const dirs = [...new Set(all.filter(n => n.kind === 'call' && n.path).map(n => topDir(n.path)))];
  if (dirs.length > 1) wrap.append(h('div', { class: 'legend' }, dirs.map(dd => h('span', null, h('i', { style: `background:${dirVar(dd + '/x')}` }), dd + '/'))));
  if (!f.roots.length) { wrap.append(h('p', { class: 'sub' }, 'This flow has no steps yet.')); return wrap; }
  if (S.mode === 'graph') wrap.append(renderGraph(f));
  else wrap.append(treeUl(f.roots, [f.id], true));
  return wrap;
}

function nodeRow(n, opts = {}) {
  const hasKids = n.children.length > 0 || (n.kind === 'ref' && n.targetFlow);
  const open = n.kind === 'ref' ? S.refOpen.has(n.id) : !S.collapsed.has(n.id);
  const toggle = (e) => {
    e.stopPropagation();
    if (n.kind === 'ref') { S.refOpen.has(n.id) ? S.refOpen.delete(n.id) : S.refOpen.add(n.id); }
    else { S.collapsed.has(n.id) ? S.collapsed.delete(n.id) : S.collapsed.add(n.id); }
    render();
  };
  const hl = (t) => highlight(t, opts.terms);
  const parts = [];
  if (!opts.flat) parts.push(h('span', { class: 'tw' + (hasKids ? '' : ' leaf'), onclick: hasKids ? toggle : null }, hasKids ? (open ? '▾' : '▸') : '•'));
  if (n.cond) parts.push(h('span', { class: 'tag cond' }, n.cond === 'else' ? 'else' : 'if ' + n.cond));
  if (n.async) parts.push(h('span', { class: 'tag async' }, 'async'));
  if (n.kind === 'call') {
    parts.push(h('span', { class: 'sym' }, hl(n.symbol)));
    if (n.path && (!n.inherited || opts.flat)) parts.push(h('span', { class: 'path' }, hl(n.path)));
  } else if (n.kind === 'boundary') {
    parts.push(h('span', { class: 'tag bnd' }, '⇄'), h('span', { class: 'sym' }, hl(n.label)));
  } else if (n.kind === 'effect') {
    parts.push(h('span', { class: 'tag eff' }, n.effect), h('span', { class: 'mono' }, hl(n.label)));
  } else if (n.kind === 'result') {
    parts.push(h('span', { class: 'mono', style: 'color:var(--muted)' }, '→ ', hl(n.label)));
  } else if (n.kind === 'ref') {
    parts.push(h('span', { class: 'reflink', onclick: (e) => { e.stopPropagation(); if (n.targetFlow) go('flow', n.target); } }, '↪ ' + (n.targetFlow ? n.targetFlow.name : '@' + n.target + ' (missing)')));
  }
  if (n.note) parts.push(h('span', { class: 'note' }, hl(n.note)));
  const style = n.kind === 'call' && n.path ? `--dc:${dirVar(n.path)}` : null;
  const row = h('div', { class: 'row' + (S.sel === n ? ' sel' : '') + (opts.hit ? ' hit' : ''), 'data-id': n.id, tabindex: 0, style, onclick: () => { if (opts.flat) goToNode(n); else { S.sel = n; render(); } } }, parts);
  row.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') row.click();
    else if ((e.key === 'ArrowRight' && !open) || (e.key === 'ArrowLeft' && open)) { if (hasKids) toggle(e); }
  });
  return row;
}
function treeUl(nodes, stack, root) {
  return h('ul', { class: 'tree' + (root ? ' root' : '') }, nodes.map(n => {
    const li = h('li', null, nodeRow(n));
    if (n.kind === 'ref') {
      if (S.refOpen.has(n.id) && n.targetFlow) {
        if (stack.includes(n.targetFlow.id)) li.append(h('div', { class: 'recur' }, '↻ recursive reference'));
        else li.append(treeUl(n.targetFlow.roots, [...stack, n.targetFlow.id]));
      }
    } else if (n.children.length && !S.collapsed.has(n.id)) li.append(treeUl(n.children, stack));
    return li;
  }));
}
function highlight(text, terms) {
  if (!terms || !terms.length || !text) return text;
  const re = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
  return text.split(re).map((p, i) => i % 2 ? h('mark', null, p) : p);
}

// ---- graph (left-to-right tidy tree with pan/zoom)
const GF1 = '600 12px ' + getComputedStyle(document.documentElement).getPropertyValue('--mono');
const GF2 = '10.5px ' + getComputedStyle(document.documentElement).getPropertyValue('--mono');
let lastLayout = null;
function boxText(n) {
  if (n.kind === 'call') return [n.symbol, n.inherited ? '↳ same file' : basename(n.path || '')];
  if (n.kind === 'boundary') return [n.label, 'boundary'];
  if (n.kind === 'effect') return [n.label, n.effect];
  if (n.kind === 'result') return ['→ ' + n.label, 'result'];
  return ['↪ ' + (n.targetFlow ? n.targetFlow.name : n.target), 'flow ref'];
}
function renderGraph(f) {
  const ROW = 54, BH = 40, GAPX = 56, MAXW = 300;
  const items = []; const colW = []; let leafY = 0;
  const measure = (n, d) => {
    const [t1, t2] = boxText(n);
    const w = Math.min(MAXW, Math.max(textW(t1, GF1), textW(t2 + (n.async ? ' · async' : ''), GF2)) + 26);
    colW[d] = Math.max(colW[d] || 0, w);
    const kids = S.collapsed.has(n.id) ? [] : n.children;
    const ys = kids.map(c => measure(c, d + 1));
    const y = ys.length ? (ys[0] + ys[ys.length - 1]) / 2 : (leafY += ROW) - ROW;
    items.push({ n, d, y, w, kids, t1, t2 });
    return y;
  };
  for (const r of f.roots) { measure(r, 0); leafY += ROW * 0.4; }
  const colX = []; let acc = 0; colW.forEach((w, i) => { colX[i] = acc; acc += w + GAPX; });
  const at = new Map(items.map(it => [it.n, it]));
  lastLayout = { at, colX, BH };

  const box = h('div', { class: 'graphbox' });
  const svg = s('svg', { role: 'img', 'aria-label': 'Call graph for ' + f.name });
  const g = s('g');
  svg.append(s('defs', null, s('marker', { id: 'garr', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto' }, s('path', { d: 'M0,0 L10,5 L0,10 z', style: 'fill:var(--edge)' }))), g);
  for (const it of items) {
    const x1 = colX[it.d] + it.w, y1 = it.y + BH / 2;
    for (const c of it.kids) {
      const ci = at.get(c); const x2 = colX[ci.d], y2 = ci.y + BH / 2, mx = x1 + (x2 - x1) / 2;
      g.append(s('path', { class: 'gedge' + (c.async ? ' async' : ''), d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 2},${y2}`, 'marker-end': 'url(#garr)' }));
      if (c.cond) g.append(s('text', { class: 'glabel', x: x2 - 6, y: y2 - 7, 'text-anchor': 'end' }, clip(c.cond === 'else' ? 'else' : 'if ' + c.cond, GF2, GAPX + 60)));
    }
  }
  for (const it of items) {
    const n = it.n, x = colX[it.d];
    const cls = 'gnode' + (S.sel === n ? ' sel' : '') + (n.kind === 'boundary' ? ' bnd' : '') + (n.kind === 'effect' ? ' eff' : '') + (n.kind === 'result' ? ' res' : '');
    const node = s('g', { class: cls, transform: `translate(${x},${it.y})`, style: n.kind === 'call' && n.path ? `--dc:${dirVar(n.path)}` : (n.kind === 'ref' ? '--dc:var(--accent)' : null) },
      s('title', null, n.raw),
      s('rect', { class: 'box', width: it.w, height: BH, rx: n.kind === 'ref' ? 20 : 7 }),
      s('text', { class: 't1', x: 12, y: 17 }, clip(it.t1, GF1, it.w - 22)),
      s('text', { class: 't2', x: 12, y: 32 }, clip(it.t2 + (n.async ? ' · async' : ''), GF2, it.w - 22)));
    const hidden = S.collapsed.has(n.id) && n.children.length;
    if (hidden || n.children.length) {
      node.append(s('circle', { cx: it.w, cy: BH / 2, r: 8, style: 'fill:var(--panel);stroke:var(--edge)' }),
        s('text', { x: it.w, y: BH / 2 + 3.5, 'text-anchor': 'middle', style: 'font-size:10px;fill:var(--muted)' }, hidden ? '+' + n.children.length : '−'));
    }
    node.addEventListener('click', (e) => {
      if (svg.dataset.moved === '1') return;
      if (e.target.tagName === 'circle' || (e.target.tagName === 'text' && !e.target.classList.length)) { S.collapsed.has(n.id) ? S.collapsed.delete(n.id) : S.collapsed.add(n.id); render(); return; }
      if (n.kind === 'ref' && n.targetFlow && e.detail > 1) { go('flow', n.target); return; }
      S.sel = n; render();
    });
    node.addEventListener('dblclick', () => { if (n.kind === 'ref' && n.targetFlow) go('flow', n.target); else if (n.children.length) { S.collapsed.has(n.id) ? S.collapsed.delete(n.id) : S.collapsed.add(n.id); render(); } });
    g.append(node);
  }
  svg.append(g); box.append(svg, h('div', { class: 'graphhint' }, 'drag to pan · wheel to zoom · double-click to fold'));

  const bboxW = acc - GAPX, bboxH = leafY;
  const view = () => S.views[f.id];
  const apply = () => { const v = view(); g.setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.k})`); };
  requestAnimationFrame(() => {
    if (!view()) {
      // First view keeps text legible (k ≥ 0.6, pan for the rest); the Fit button fits exactly.
      const r = svg.getBoundingClientRect();
      const fit = Math.min(1, (r.width - 40) / Math.max(bboxW, 1), (r.height - 40) / Math.max(bboxH, 1));
      const k = S.fitExact ? Math.max(fit, 0.15) : Math.max(fit, 0.6);
      S.fitExact = false;
      S.views[f.id] = { k, x: 20, y: Math.max(20, (r.height - bboxH * k) / 2) };
    }
    apply();
  });
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const v = view(); if (!v) return;
    const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const k2 = Math.min(3, Math.max(0.15, v.k * Math.exp(-e.deltaY * 0.0015)));
    v.x = mx - (mx - v.x) * k2 / v.k; v.y = my - (my - v.y) * k2 / v.k; v.k = k2; apply();
  }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', (e) => { const v = view(); if (!v) return; drag = { sx: e.clientX, sy: e.clientY, x: v.x, y: v.y }; svg.dataset.moved = '0'; });
  svg.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (svg.dataset.moved === '0' && Math.hypot(dx, dy) < 4) return;
    if (svg.dataset.moved === '0') { svg.dataset.moved = '1'; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId); }
    const v = view(); v.x = drag.x + dx; v.y = drag.y + dy; apply();
  });
  const end = () => { drag = null; svg.classList.remove('drag'); setTimeout(() => { svg.dataset.moved = '0'; }, 0); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  return box;
}
function centerOn(n) {
  const svg = document.querySelector('.graphbox svg'); if (!svg || !lastLayout) return;
  const it = lastLayout.at.get(n); if (!it) return;
  const v = S.views[n.flow.id]; if (!v) return;
  const r = svg.getBoundingClientRect();
  v.x = r.width / 2 - (lastLayout.colX[it.d] + it.w / 2) * v.k;
  v.y = r.height / 2 - (it.y + lastLayout.BH / 2) * v.k;
  svg.querySelector('g').setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.k})`);
}

// ---- search
function renderSearch() {
  const d = S.doc, terms = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  const match = (str) => { const l = str.toLowerCase(); return terms.every(t => l.includes(t)); };
  const wrap = h('div', null, h('h2', null, 'Search'), h('p', { class: 'sub' }, '“' + S.q.trim() + '”'));
  const flowHits = d.flows.filter(f => match(f.name + ' ' + f.trigger + ' ' + f.id));
  if (flowHits.length) wrap.append(h('h3', null, 'Flows'), h('div', { class: 'cards' }, flowHits.map(f => h('button', { class: 'card', onclick: () => { S.q = ''; go('flow', f.id); } }, h('b', null, highlight(f.name, terms)), f.trigger && h('div', { class: 'meta' }, highlight(f.trigger, terms))))));
  let total = 0;
  for (const f of d.flows) {
    const hits = [];
    walk(f.roots, n => { if (match([n.path, n.symbol, n.label, n.note, n.cond || '', n.effect || ''].join(' '))) hits.push(n); });
    if (!hits.length) continue;
    total += hits.length;
    wrap.append(h('h3', null, f.name + ' ', h('span', { class: 'sub' }, '(' + hits.length + ')')),
      h('div', null, hits.slice(0, 100).map(n => nodeRow(n, { flat: true, terms, hit: false }))));
  }
  if (!total && !flowHits.length) wrap.append(h('p', { class: 'sub' }, 'No matches.'));
  return wrap;
}

// ---- files
function renderFiles() {
  const d = S.doc;
  const wrap = h('div', null, h('h2', null, 'Files'), h('p', { class: 'sub' }, 'Every file that appears in a flow, and where.'));
  if (d.keyFiles.length) {
    wrap.append(h('h3', null, 'Key files'), h('table', null,
      h('tr', null, h('th', null, 'Concern'), h('th', null, 'Files')),
      d.keyFiles.map(r => h('tr', null, h('td', null, inline(r.concern)), h('td', null, inline(r.files))))));
  }
  const paths = [...d.files.keys()].sort((a, b) => d.dirs.indexOf(topDir(a)) - d.dirs.indexOf(topDir(b)) || a.localeCompare(b));
  wrap.append(h('h3', null, 'All traced files (' + paths.length + ')'));
  wrap.append(h('table', null, h('tr', null, h('th', null, 'File'), h('th', null, 'Used in')), paths.map(p => {
    const byFlow = new Map();
    for (const n of d.files.get(p)) { if (!byFlow.has(n.flow)) byFlow.set(n.flow, []); byFlow.get(n.flow).push(n); }
    return h('tr', null,
      h('td', { class: 'mono', style: `border-left:3px solid ${dirVar(p)}` }, p),
      h('td', null, [...byFlow].map(([fl, ns]) => h('span', { class: 'chip', title: [...new Set(ns.map(n => n.symbol))].join(', '), onclick: () => goToNode(ns[0]) }, fl.name + ' · ' + [...new Set(ns.map(n => n.symbol))].slice(0, 3).join(', ') + (ns.length > 3 ? '…' : '')))));
  })));
  return wrap;
}

// ---- lint
function renderLint() {
  const d = S.doc;
  const wrap = h('div', null, h('h2', null, 'Lint'),
    h('p', { class: 'sub' }, `Checks flow.md against the brain-docs format: current state only, notes ≤ ${LIMITS.note} chars, flows ≤ ${LIMITS.flowLines} lines, file ≤ ${LIMITS.fileLines} lines, valid @refs.`));
  if (!d.lint.length) { wrap.append(h('p', null, '✓ No issues.')); return wrap; }
  wrap.append(h('ul', { class: 'lint' }, d.lint.map(l => h('li', null, h('span', { class: 'sev ' + l.sev }, l.sev), h('span', null, l.msg), h('span', { class: 'ln' }, 'line ' + l.line)))));
  return wrap;
}

// ---- details panel
function renderDetails() {
  const box = $('#details'); const n = S.sel;
  box.replaceChildren();
  if (!n || !S.doc) { box.hidden = true; return; }
  box.hidden = false;
  const d = S.doc;
  const close = h('button', { class: 'btn close', onclick: () => { S.sel = null; render(); }, 'aria-label': 'Close details' }, '✕');
  const [t1] = boxText(n);
  box.append(close, h('h3', null, t1), h('div', { class: 'sub' }, { call: 'call', boundary: 'process / network boundary', effect: 'side effect · ' + n.effect, result: 'returns / responds with', ref: 'reference to another flow' }[n.kind]));
  if (n.path) {
    box.append(h('div', { class: 'k' }, 'File'), h('div', { class: 'mono', style: 'overflow-wrap:anywhere' }, n.path, ' ',
      h('button', { class: 'btn', style: 'padding:0 6px;font-size:11px', onclick: (e) => { try { navigator.clipboard.writeText(n.path); e.target.textContent = 'copied'; } catch (err) { /* ignore */ } } }, 'copy')));
  }
  if (n.note) box.append(h('div', { class: 'k' }, 'Note'), h('div', null, n.note));
  if (n.cond) box.append(h('div', { class: 'k' }, 'Runs when'), h('div', null, n.cond));
  if (n.async) box.append(h('div', { class: 'k' }, 'Async'), h('div', null, 'Runs in the background / off the request path.'));
  box.append(h('div', { class: 'k' }, 'Source'), h('div', { class: 'mono' }, 'flow.md line ' + n.line + ' · ' + n.flow.name));
  if (n.parent) box.append(h('div', { class: 'k' }, 'Called by'), h('span', { class: 'chip', onclick: () => goToNode(n.parent) }, boxText(n.parent)[0]));
  if (n.children.length) box.append(h('div', { class: 'k' }, 'Calls (' + n.children.length + ')'), h('div', null, n.children.map(c => h('span', { class: 'chip', onclick: () => goToNode(c) }, boxText(c)[0]))));
  if (n.kind === 'ref' && n.targetFlow) box.append(h('div', { class: 'k' }, 'Target flow'), h('span', { class: 'chip', onclick: () => go('flow', n.target) }, n.targetFlow.name), n.targetFlow.trigger && h('div', { class: 'sub' }, n.targetFlow.trigger));
  // Same symbol / file / boundary elsewhere.
  const others = [];
  for (const m of d.nodes.values()) {
    if (m === n) continue;
    if (n.kind === 'call' && m.kind === 'call' && m.path === n.path && m.symbol === n.symbol) others.push(m);
    else if (n.kind !== 'call' && m.kind === n.kind && m.label === n.label) others.push(m);
  }
  if (others.length) box.append(h('div', { class: 'k' }, 'Also appears in'), h('div', null, others.map(m => h('span', { class: 'chip', onclick: () => goToNode(m) }, m.flow.name))));
  if (n.kind === 'call' && n.path) {
    const fl = [...new Set((d.files.get(n.path) || []).map(m => m.flow))].filter(f => f !== n.flow);
    if (fl.length) box.append(h('div', { class: 'k' }, 'Same file in other flows'), h('div', null, fl.map(f => h('span', { class: 'chip', onclick: () => goToNode(d.files.get(n.path).find(m => m.flow === f)) }, f.name))));
  }
}

// ---------------------------------------------------------------- chrome
$('#openBtn').onclick = openFile;
$('#reloadBtn').onclick = async () => {
  if (!S.src) return;
  if (S.src.kind === 'handle') { const f = await S.src.handle.getFile(); S.src.lastMod = f.lastModified; setText(await f.text()); }
  else if (S.src.kind === 'url') loadFromUrl();
};
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === '/' && !typing && S.doc) { e.preventDefault(); const q = $('#q'); if (q) q.focus(); }
  else if (e.key === 'Escape') {
    if (S.q) { S.q = ''; render(); }
    else if (S.sel) { S.sel = null; render(); }
  }
});

// ---------------------------------------------------------------- boot
(async function boot() {
  applyTheme();
  parseHash();
  if (/^https?:$/.test(location.protocol) && await loadFromUrl()) return;
  const saved = await idb.get(IDB_KEY);
  if (saved && saved.queryPermission) {
    try {
      if ((await saved.queryPermission({ mode: 'read' })) === 'granted') { await useHandle(saved); return; }
      S.pendingHandle = saved;
    } catch (e) { /* stale handle */ }
  }
  render();
})();
})();
</script>
</body>
