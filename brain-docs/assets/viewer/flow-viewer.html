<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bump this when the viewer changes; the brain-docs skill re-copies older versions. -->
<meta name="brain-docs-viewer" content="2">
<title>Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Tokens — see the Tracer handoff README §4. Dark only. Layer colours are
   oklch(L C var(--h)); alpha always goes in the "/ a" slot, never as a hex suffix. */
:root {
  --bg-app: #15181d; --bg-canvas: #0b0d11; --bg-chrome: #0e1116; --bg-card: #10141a; --bg-sunken: #0f1318;
  --bg-raised: #111620; --bg-code: #08090c; --bg-hover: #141922; --bg-active: #151b24;
  --line: #1d222a; --line-soft: #14181f; --line-card: #262c35; --line-hover: #4a5563; --line-chip: #38404b; --spine: #1f252e;
  --ink-1: #f2f5f9; --ink-2: #e6e9ee; --ink-3: #cfd7e1; --ink-4: #c3cbd6; --ink-5: #a8b3c0; --ink-6: #96a0ae; --ink-7: #8b95a3; --ink-meta: #7f8a98;
  --ok: oklch(0.74 0.13 150); --ok-ink: oklch(0.82 0.10 150);
  --warn-bg: oklch(0.32 0.07 60 / 0.6); --warn-ink: oklch(0.86 0.11 70); --warn-line: oklch(0.50 0.10 60);
  --link: oklch(0.74 0.13 250);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* Aliases for the tree / graph / files / lint pages. */
  --bg: var(--bg-canvas); --panel: var(--bg-chrome); --panel2: var(--bg-raised); --ink: var(--ink-2); --muted: var(--ink-7);
  --hover: var(--bg-hover); --sel: oklch(0.26 0.05 250); --accent: var(--link); --accent-ink: #0b0d11;
  --edge: #4a5563; --mark: oklch(0.45 0.09 60); --warn: var(--warn-ink); --err: oklch(0.72 0.15 25); --info: var(--link);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg-app); color: var(--ink-2); font: 13px/1.45 var(--sans); }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12px; }
code { background: var(--bg-raised); padding: 1px 4px; border-radius: 4px; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }

.app { display: grid; grid-template-columns: 204px minmax(0, 1fr) auto; grid-template-rows: 52px minmax(0, 1fr); height: 100vh; }

/* ---- top bar */
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--bg-chrome); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand .mark { width: 17px; height: 17px; border-radius: 5px; flex: none; background: linear-gradient(135deg, oklch(0.74 0.13 250), oklch(0.74 0.13 150)); }
.brand b { font: 600 13.5px var(--sans); letter-spacing: -0.01em; color: var(--ink-2); }
.brand .proj { font: 400 11px var(--mono); color: var(--ink-7); max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.vdiv { width: 1px; height: 20px; background: #252b34; flex: none; }
.ident { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ident .t { font: 600 12px var(--sans); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ident .m { font: 400 10px var(--mono); color: var(--ink-7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
#flowCtl { display: flex; align-items: center; gap: 10px; }
.stepper, .seg { display: flex; align-items: center; padding: 4px; background: var(--bg-sunken); border: 1px solid #232b36; border-radius: 8px; flex: none; }
.stepper button, .seg button { font: 600 12px var(--mono); color: var(--ink-7); padding: 4px 9px; border-radius: 5px; border: 0; background: none; cursor: pointer; }
.seg button { font: 500 11px var(--sans); padding: 3px 9px; }
.stepper button:hover, .seg button:hover, .seg button.on { background: #1a212b; color: var(--ink-2); }
.stepper .lbl { font: 500 11px var(--mono); color: var(--ink-4); min-width: 74px; text-align: center; }
.toggle { display: flex; align-items: center; gap: 8px; padding: 6px 11px; background: var(--bg-raised); border: 1px solid #232b36; border-radius: 7px; font: 500 11.5px var(--sans); color: var(--ink-4); cursor: pointer; white-space: nowrap; transition: border-color .18s; }
.toggle:hover { border-color: var(--line-chip); }
.toggle .short { display: none; }
.pillsw { font: 600 9.5px var(--mono); letter-spacing: 0.06em; padding: 2px 6px; border-radius: 4px; background: #1b212a; color: var(--ink-7); }
.pillsw.on { background: var(--ok); color: #0b0d11; }
.jump { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg-sunken); border: 1px solid var(--line-card); border-radius: 7px; font: 400 11px var(--mono); color: var(--ink-7); cursor: pointer; white-space: nowrap; transition: border-color .18s; }
.jump:hover { border-color: var(--line-chip); }
.jump kbd { padding: 1px 5px; border-radius: 3px; background: #1b212a; color: var(--ink-7); font: 400 10px var(--mono); }
.status { display: flex; align-items: center; gap: 6px; font: 400 10px var(--mono); color: var(--ink-7); white-space: nowrap; }
.status .dot0 { width: 7px; height: 7px; border-radius: 50%; background: var(--edge); }
.status .dot0.live { background: var(--ok); }
.btn { border: 1px solid var(--line-card); background: var(--bg-sunken); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; font: 500 11.5px var(--sans); color: var(--ink-4); transition: border-color .18s; }
.btn:hover { border-color: var(--line-chip); }
.btn.primary { background: var(--ok); color: #0b0d11; border-color: var(--ok); }
.btn.on { background: #1a212b; color: var(--ink-2); }
#menuBtn { display: none; }

/* ---- left rail */
aside#side { overflow: auto; background: var(--bg-chrome); border-right: 1px solid var(--line); }
.rsec { position: relative; padding: 14px 12px 12px; }
.rsec + .rsec::before { content: ""; position: absolute; top: 0; left: 12px; right: 12px; height: 1px; background: var(--line); }
.rlab { font: 600 9.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-7); margin: 0 0 9px 2px; }
.dot { width: 8px; height: 8px; border-radius: 2.5px; flex: none; display: inline-block; background: oklch(0.74 0.13 var(--h, 250)); box-shadow: 0 0 0 3px oklch(0.74 0.13 var(--h, 250) / 0.14); }
.trc { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 8px; margin-bottom: 5px; background: var(--bg-sunken); border: 1px solid var(--line); cursor: pointer; transition: border-color .18s, background .18s; }
.trc:hover { border-color: var(--line-chip); }
.trc.sel { background: oklch(0.26 0.05 var(--h)); border-color: oklch(0.50 0.09 var(--h)); }
.trc.off { opacity: .45; }
.trc .r1 { display: flex; align-items: center; gap: 7px; }
.trc .nm { flex: 1; min-width: 0; font: 600 11.5px/1.3 var(--sans); color: #d6dde6; overflow-wrap: anywhere; }
.trc .ct { font: 400 10px var(--mono); color: var(--ink-7); }
.trc .sm { margin-top: 4px; font: 400 10.5px/1.45 var(--sans); color: var(--ink-7); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.trc .sm code { font-size: 10px; padding: 0 3px; }
.phr { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 7px 8px; border-radius: 7px; border: 0; background: none; cursor: pointer; transition: background .18s; }
.phr:hover { background: var(--bg-hover); }
.phr.active { background: var(--bg-active); }
.phr .bar { width: 3px; height: 26px; border-radius: 2px; flex: none; background: oklch(0.74 0.13 var(--h)); opacity: .42; }
.phr.active .bar { opacity: 1; }
.phr .tx { min-width: 0; }
.phr .nm { font: 500 11.5px var(--sans); color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phr .rg { font: 400 9.5px var(--mono); color: var(--ink-7); }
.lyr { display: flex; align-items: center; gap: 9px; padding: 5px 0; font: 500 11.5px var(--sans); color: var(--ink-4); }
.lyr span { min-width: 0; overflow-wrap: anywhere; }
.lyr .n { margin-left: auto; font: 400 10px var(--mono); color: var(--ink-7); }
.hint { margin: 14px 0 0; font: 400 11px/1.55 var(--sans); color: var(--ink-7); }
.nav { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 7px; cursor: pointer; font: 500 11.5px var(--sans); color: var(--ink-4); }
.nav:hover { background: var(--bg-hover); }
.nav.active { background: var(--bg-active); color: var(--ink-2); }
.nav .n { margin-left: auto; font: 400 10px var(--mono); color: var(--ink-7); }
.pill { font: 600 9.5px var(--mono); border-radius: 4px; padding: 1px 6px; margin-left: auto; }
.pill.err { background: var(--err); color: #0b0d11; }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill.ok { color: var(--ink-7); }

/* ---- canvas */
main#main { overflow: auto; min-width: 0; background: var(--bg-canvas); padding: 18px 22px 60px; }
main#main.flush { padding: 0; }
main h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; color: var(--ink-1); }
.sub { color: var(--ink-7); margin: 0 0 12px; }
.trace { min-width: calc(102px + var(--L) * 180px); padding-bottom: 40px; }
.grid { display: grid; grid-template-columns: var(--cols); column-gap: 10px; }
.lanes { position: sticky; top: 0; z-index: 3; padding: 11px 16px; background: rgb(11 13 17 / 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); align-items: center; }
.lanes .lab { font: 600 9.5px var(--mono); letter-spacing: 0.08em; color: var(--ink-meta); }
.lanes .lane { display: flex; align-items: center; gap: 8px; min-width: 0; font: 600 10.5px var(--mono); letter-spacing: 0.04em; color: var(--ink-7); }
.lanes .lane span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trig { padding: 14px 16px 2px; }
.trig > div { grid-column: 2 / -1; font: 400 11.5px/1.5 var(--sans); color: var(--ink-6); }
.trig .l { font: 600 9.5px var(--mono); letter-spacing: 0.08em; color: var(--ink-7); margin-right: 10px; }
.band { padding: 18px 0 14px; border-bottom: 1px solid var(--line-soft); background: linear-gradient(90deg, oklch(0.30 0.05 var(--h) / 0.16), transparent 38%); transition: background .18s; }
.band.active { background: linear-gradient(90deg, oklch(0.30 0.05 var(--h) / 0.4), transparent 38%); }
.band-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px; padding: 0 16px 10px; }
.pnum { font: 600 9.5px var(--mono); letter-spacing: 0.06em; padding: 2px 6px; border-radius: 4px; color: oklch(0.90 0.07 var(--h)); background: oklch(0.32 0.06 var(--h)); border: 1px solid oklch(0.48 0.09 var(--h)); }
.pname { font: 600 12.5px var(--sans); letter-spacing: -0.01em; color: #dfe5ec; }
.psub { font: 400 11.5px var(--sans); color: var(--ink-7); }
.srow { padding: 0 16px; align-items: stretch; }
.gut { grid-column: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding-top: 9px; }
.sn { font: 600 9.5px var(--mono); color: var(--ink-7); padding: 2px 6px; border-radius: 4px; background: var(--bg-sunken); border: 1px solid var(--line); transition: background .18s, border-color .18s, color .18s; }
.srow.cur .sn { color: oklch(0.90 0.07 var(--h)); background: oklch(0.32 0.06 var(--h)); border-color: oklch(0.48 0.09 var(--h)); }
.spine { flex: 1; width: 1px; background: var(--spine); }
.srow.cur .spine { background: oklch(0.55 0.10 var(--h)); }
.cell { padding: 7px 0; min-width: 0; }
.tcard { width: 100%; padding: 11px 12px; border-radius: 9px; cursor: pointer; background: var(--bg-card); border: 1px solid var(--line-card); transition: border-color .18s, background .18s, box-shadow .18s; }
.tcard:hover { border-color: var(--line-hover); }
.srow.cur .tcard { border-color: oklch(0.46 0.08 var(--h)); }
.tcard.sel, .srow.cur .tcard.sel { background: oklch(0.26 0.05 var(--h)); border-color: oklch(0.70 0.12 var(--h)); box-shadow: 0 0 0 3px oklch(0.70 0.12 var(--h) / 0.18); }
.tcard.ref { border-style: dashed; }
.tcard:focus-visible { outline: 2px solid oklch(0.70 0.12 var(--h)); outline-offset: 2px; }
.ct { display: flex; gap: 7px; align-items: flex-start; }
.tt { flex: 1; min-width: 0; overflow-wrap: anywhere; font: 600 12px/1.4 var(--mono); letter-spacing: -0.01em; color: var(--ink-2); }
.present .tt { font: 600 13px/1.4 var(--sans); color: var(--ink-1); }
.tag2 { flex: none; font: 500 8.5px/1.3 var(--mono); padding: 2px 5px; border-radius: 3px; letter-spacing: 0.04em; text-transform: uppercase; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag2.cond { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); }
.tag2.async { background: #1b212a; color: var(--ink-7); border: 1px solid var(--line-card); }
.cb { margin-top: 5px; font: 400 11px/1.5 var(--sans); color: var(--ink-7); overflow-wrap: anywhere; }
.fx { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.fxc { font: 400 10px/1.4 var(--mono); color: var(--ink-5); background: var(--bg-sunken); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
.present .cb, .present .fx { display: none; }
.ps { display: flex; gap: 6px; align-items: flex-start; margin-top: 9px; padding-top: 8px; border-top: 1px dashed #232a34; }
.ps .l { flex: none; font: 600 9px/1.65 var(--mono); letter-spacing: 0.06em; color: var(--ok-ink); }
.ps .v { min-width: 0; font: 400 10px/1.5 var(--mono); color: var(--ink-7); overflow-wrap: anywhere; }
.brow { padding: 2px 16px; }
.bnd { grid-column: 2 / -1; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 4px 0; cursor: pointer; font: 500 10px var(--mono); color: var(--ink-7); text-align: left; }
.bnd::before, .bnd::after { content: ""; flex: 1; height: 1px; background: repeating-linear-gradient(90deg, #2c3440 0 4px, transparent 4px 8px); }
.bnd:hover { color: var(--ink-4); }
.rrow { padding: 18px 16px 0; }
.ret { grid-column: 2 / -1; padding: 13px 15px; border-radius: 9px; border: 1px dashed #2c3440; background: #0e1217; font: 400 11.5px/1.5 var(--sans); color: var(--ink-4); }
.ret .l { font: 600 9.5px var(--mono); letter-spacing: 0.08em; color: var(--ok-ink); margin-right: 10px; }
.ret code { font-size: 11px; }

/* ---- tree / graph / overview / files / lint */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 12px; }
.banner { border: 1px solid var(--warn-line); background: oklch(0.26 0.05 60 / 0.4); color: #dcd3c2; border-radius: 9px; padding: 10px 12px; margin: 10px 0 14px; }
ul.tree { list-style: none; margin: 0; padding-left: 20px; border-left: 1px dashed var(--line-card); margin-left: 7px; }
ul.tree.root { padding-left: 0; border-left: 0; margin-left: 0; }
.row { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 7px; padding: 3px 8px 3px 4px; border-radius: 6px; cursor: pointer; border-left: 3px solid var(--dc, var(--edge)); margin: 1px 0; }
.row:hover { background: var(--bg-hover); }
.row.sel { background: var(--bg-active); }
.tw { width: 14px; flex: none; text-align: center; color: var(--ink-7); user-select: none; }
.tw.leaf { opacity: .35; }
.sym { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--dc, var(--ink-2)); }
.path { font-family: var(--mono); font-size: 11.5px; color: var(--ink-7); overflow-wrap: anywhere; }
.note { color: var(--ink-6); font-size: 12.5px; }
.note::before { content: "— "; }
.tag { font: 500 10px var(--mono); border-radius: 4px; padding: 0 6px; border: 1px solid var(--line-card); color: var(--ink-7); white-space: nowrap; }
.tag.cond { border-color: var(--warn-line); color: var(--warn-ink); }
.tag.async { border-color: var(--line-chip); }
.tag.bnd { background: var(--ink-2); color: var(--bg-canvas); border-color: var(--ink-2); }
.tag.eff { background: var(--bg-raised); }
.reflink { font-weight: 600; color: var(--link); }
.recur { color: var(--ink-7); font-size: 12px; padding: 2px 26px; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.graphbox { position: relative; height: calc(100vh - 200px); min-height: 380px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-chrome); overflow: hidden; touch-action: none; }
.graphbox svg { width: 100%; height: 100%; display: block; cursor: grab; }
.graphbox svg.drag { cursor: grabbing; }
.graphhint { position: absolute; right: 10px; bottom: 8px; font-size: 11px; color: var(--ink-7); pointer-events: none; }
svg text { font-family: var(--mono); }
.gnode { cursor: pointer; }
.gnode rect.box { fill: var(--bg-card); stroke: var(--dc, var(--edge)); stroke-width: 1.5; }
.gnode.sel rect.box { fill: var(--bg-active); stroke-width: 2.5; }
.gnode.bnd rect.box { stroke-dasharray: 5 3; }
.gnode.eff rect.box, .gnode.res rect.box { fill: var(--bg-raised); }
.gnode.res rect.box { stroke-dasharray: 2 3; }
.gnode .t1 { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
.gnode .t2 { fill: var(--ink-7); font-size: 10.5px; }
.gedge { fill: none; stroke: var(--edge); stroke-width: 1.4; }
.gedge.async { stroke-dasharray: 4 3; }
.glabel { fill: var(--warn-ink); font-size: 10.5px; paint-order: stroke; stroke: var(--bg-chrome); stroke-width: 4px; }
.cbox { fill: var(--bg-card); stroke: var(--link); stroke-width: 1.5; }
.ctext { fill: var(--ink-2); font-size: 12.5px; font-weight: 600; font-family: var(--sans); }
.clabel { fill: var(--ink-7); font-size: 11px; paint-order: stroke; stroke: var(--bg-canvas); stroke-width: 4px; font-family: var(--sans); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card { text-align: left; border: 1px solid var(--line-card); background: var(--bg-card); border-radius: 9px; padding: 11px 12px; cursor: pointer; transition: border-color .18s; }
.card:hover { border-color: var(--line-hover); }
.card b { display: block; margin-bottom: 3px; color: var(--ink-2); }
.card .meta { font: 400 10.5px var(--mono); color: var(--ink-7); margin-top: 4px; }
.ov-svg { width: 100%; height: auto; display: block; background: var(--bg-chrome); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0 18px; }
.prose p { margin: 6px 0; }
.prose ul { margin: 6px 0; padding-left: 20px; }
h3 { font-size: 14px; font-weight: 600; margin: 22px 0 8px; color: var(--ink-2); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); padding: 6px 8px; }
th { color: var(--ink-7); font: 600 9.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
td.mono { overflow-wrap: anywhere; }
.chip { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 11.5px; cursor: pointer; background: var(--bg-sunken); transition: border-color .18s; }
.chip:hover { border-color: var(--line-chip); }
.lint { list-style: none; padding: 0; margin: 0; }
.lint li { display: flex; gap: 8px; padding: 7px 4px; border-bottom: 1px solid var(--line); }
.lint .sev { font: 600 9.5px/1.9 var(--mono); width: 44px; flex: none; text-transform: uppercase; letter-spacing: 0.06em; }
.lint .sev.error { color: var(--err); } .lint .sev.warn { color: var(--warn-ink); } .lint .sev.info { color: var(--link); }
.lint .ln { margin-left: auto; color: var(--ink-7); font: 400 10.5px var(--mono); white-space: nowrap; }

/* ---- detail panel */
section#details { position: relative; width: 340px; overflow: auto; background: var(--bg-chrome); border-left: 1px solid var(--line); padding: 18px; }
section#details[hidden] { display: none; }
#details .close { display: none; position: absolute; top: 10px; right: 10px; }
.nosel { margin: 40% 0 0; text-align: center; color: var(--ink-7); font-size: 12px; }
.dmeta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 13px; }
.badge { font: 600 10px var(--mono); padding: 3px 7px; border-radius: 4px; color: oklch(0.88 0.08 var(--h)); background: oklch(0.30 0.06 var(--h)); border: 1px solid oklch(0.48 0.09 var(--h)); }
.dmeta .sn2 { font: 400 10px var(--mono); color: var(--ink-7); }
.dh { margin: 0; font: 600 18px/1.25 var(--mono); letter-spacing: -0.02em; color: var(--ink-1); overflow-wrap: anywhere; }
.dpath { display: block; margin-top: 7px; padding: 0; border: 0; background: none; text-align: left; cursor: copy; font: 400 11px/1.45 var(--mono); color: var(--link); overflow-wrap: anywhere; }
.lab { font: 600 9.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-7); }
.plainbox { margin-top: 17px; padding: 13px; border-radius: 9px; background: var(--bg-raised); border: 1px solid #232b36; }
.plainbox p { margin: 7px 0 0; font: 500 13px/1.55 var(--sans); color: var(--ink-3); }
.tech { margin: 15px 0 0; font: 400 12px/1.65 var(--sans); color: var(--ink-6); overflow-wrap: anywhere; }
.fail { margin-top: 15px; display: flex; gap: 10px; padding: 11px 12px; border-radius: 9px; background: oklch(0.26 0.05 60 / 0.4); border: 1px solid oklch(0.42 0.07 60); }
.fail .lab { flex: none; color: var(--warn-ink); line-height: 1.9; }
.fail p { margin: 0; font: 400 11.5px/1.55 var(--sans); color: #dcd3c2; }
.dsec { margin-top: 18px; min-width: 0; }
.rule { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.rule .ln { flex: 1; height: 1px; background: var(--line); }
.rule a, .rule .aux { font: 400 10px var(--mono); color: var(--ink-meta); text-decoration: none; white-space: nowrap; }
.rule a:hover { color: var(--ink-4); }
.pass { padding: 10px 12px; border-radius: 8px; background: var(--bg-code); border: 1px solid var(--line); font: 400 10.5px/1.55 var(--mono); color: var(--ok-ink); overflow-wrap: anywhere; }
pre.src { margin: 0; padding: 12px 13px; border-radius: 9px; background: var(--bg-code); border: 1px solid var(--line); font: 400 10.5px/1.75 var(--mono); color: var(--ink-5); overflow: auto; white-space: pre; }
.cc { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-top: 18px; }
.cc > div { min-width: 0; }
.chip2 { display: flex; align-items: center; gap: 7px; width: 100%; padding: 7px 8px; margin-bottom: 4px; border-radius: 6px; background: var(--bg-sunken); border: 1px solid var(--line); cursor: pointer; text-align: left; font: 500 10.5px var(--mono); color: #d6dde6; transition: border-color .18s; }
.chip2:hover { border-color: var(--line-chip); }
.chip2 span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.none { font: 400 11px var(--sans); color: var(--ink-7); }
.dfoot { margin-top: 18px; font: 400 10px var(--mono); color: var(--ink-meta); }

/* ---- palette */
.pal-bg { position: fixed; inset: 0; z-index: 60; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; background: rgb(0 0 0 / 0.5); }
.pal { width: min(560px, calc(100vw - 32px)); background: var(--bg-chrome); border: 1px solid #232b36; border-radius: 12px; box-shadow: 0 20px 60px rgb(0 0 0 / 0.5); overflow: hidden; }
.pal input { width: 100%; padding: 14px 16px; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--ink-2); font: 400 13px var(--sans); outline: none; }
.pal .res { max-height: 52vh; overflow: auto; padding: 6px; }
.pal .grp { display: flex; align-items: center; gap: 8px; padding: 10px 10px 4px; }
.pal .it { padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.pal .it.on { background: var(--bg-active); }
.pal .it .a { font: 600 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
.pal .it .b { font: 400 11px/1.45 var(--sans); color: var(--ink-7); overflow-wrap: anywhere; }

.empty { max-width: 560px; margin: 8vh auto; background: var(--bg-chrome); border: 1px solid var(--line); border-radius: 12px; padding: 26px 28px; }
.empty h2 { margin-top: 0; }

.empty ul { color: var(--ink-7); padding-left: 18px; }
.dropping::after { content: "Drop flow.md to load it"; position: fixed; inset: 12px; border: 3px dashed var(--link); border-radius: 16px; background: oklch(0.74 0.13 250 / 0.12); display: grid; place-items: center; font-size: 20px; font-weight: 600; color: var(--link); z-index: 50; }

@media (max-width: 1100px) {
  .app { grid-template-columns: minmax(0, 1fr) auto; }
  #menuBtn { display: inline-block; }
  aside#side { position: fixed; top: 52px; bottom: 0; left: 0; width: min(260px, 85vw); z-index: 20; transform: translateX(-102%); transition: transform .18s; box-shadow: 0 0 30px rgb(0 0 0 / 0.5); }
  aside#side.open { transform: none; }
  .ident .m, .jump span, .status .tx, .brand .proj { display: none; }
  .toggle .long { display: none; } .toggle .short { display: inline; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  header { gap: 8px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
  .brand b, .vdiv, .ident, #openBtn { display: none; }
  main#main { padding: 14px 16px 60px; }
  section#details { display: none; }
  section#details.sheet-open { display: block; position: fixed; left: 0; right: 0; bottom: 0; width: auto; max-height: 60vh; z-index: 30; border-left: 0; border-top: 1px solid var(--line); box-shadow: 0 -8px 30px rgb(0 0 0 / 0.4); }
  #details .close { display: inline-block; }
  ul.tree { padding-left: 10px; margin-left: 4px; }
  .graphbox { height: 60vh; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="btn" id="menuBtn" aria-label="Toggle navigation">☰</button>
    <div class="brand"><i class="mark"></i><b>Tracer</b><span class="proj" id="proj"></span></div>
    <span class="vdiv"></span>
    <div class="ident"><div class="t" id="docTitle">Flow Viewer</div><div class="m" id="docMeta"></div></div>
    <span class="spacer"></span>
    <div id="flowCtl"></div>
    <button class="jump" id="jumpBtn" title="Jump to a function, file or description"><span>Jump to…</span><kbd>⌘K</kbd></button>
    <span class="status" id="status"></span>
    <button class="btn" id="openBtn" title="Open flow.md">Open</button>
    <button class="btn" id="reloadBtn" title="Reload flow.md" hidden>Reload</button>
    <input type="file" id="fileInput" accept=".md,text/markdown,text/plain" hidden>
  </header>
  <aside id="side" aria-label="Navigation"></aside>
  <main id="main"></main>
  <section id="details" hidden aria-label="Step details"></section>
</div>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants
const LIMITS = { note: 80, flowLines: 40, keyPaths: 3, keyRowChars: 160, plain: 120, passes: 80, fails: 160 };
const ATTRS = ['plain', 'passes', 'fails'];
const HISTORY_RE = /\[(?:CHANGED|NEW|REMOVED|DEPRECATED)\b[^\]]*\]|\b(?:previously|no longer|supersede[sd]?|formerly|used to|was|were|old|deleted|removed)\b|\b20\d\d-\d\d-\d\d\b/i;
const LEGACY_RE = /\[(?:CHANGED|NEW)\b[^\]]*\]/g;
const IDENT_RE = /::|\w\(\)|`|\b[a-z][a-z0-9]*_[a-z0-9_]+\b/;
const EFFECTS = ['db', 'ext', 'cache', 'queue', 'fs', 'env', 'log'];
// Layer hues in lane order: Browser-blue, violet, green, amber, clay, then extras.
const HUES = [250, 300, 150, 60, 20, 200, 340, 100, 280, 40];
const KIND = { call: 'call', boundary: 'boundary', effect: 'side effect', result: 'result', ref: 'flow reference' };
const NS = 'http://www.w3.org/2000/svg';
const POLL_MS = 2000;
const IDB_KEY = 'handle:' + location.pathname;
const SERVED = /^https?:$/.test(location.protocol);

// ---------------------------------------------------------------- dom helpers
const $ = (q) => document.querySelector(q);
function setAttrs(el, a) {
  if (!a) return;
  for (const k in a) {
    const v = a[k];
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
}
function append(el, kids) {
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false || k === '') continue;
    el.append(k instanceof Node ? k : String(k));
  }
}
function h(tag, attrs, ...kids) { const el = document.createElement(tag); setAttrs(el, attrs); append(el, kids); return el; }
function s(tag, attrs, ...kids) { const el = document.createElementNS(NS, tag); setAttrs(el, attrs); append(el, kids); return el; }
function walk(nodes, fn) { for (const n of nodes) { fn(n); walk(n.children, fn); } }
function slug(t) { return t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'flow'; }
function basename(p) { return p.split('/').pop(); }
function topDir(p) { return p && p.includes('/') ? p.split('/')[0] : (p ? '(root)' : ''); }
const pad2 = (i) => String(i).padStart(2, '0');
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// Tiny inline markdown: `code` and **bold** only.
function inline(text) {
  const out = [];
  for (const part of text.split(/(`[^`]+`|\*\*[^*]+\*\*)/)) {
    if (!part) continue;
    if (part.startsWith('`') && part.endsWith('`') && part.length > 1) out.push(h('code', null, part.slice(1, -1)));
    else if (part.startsWith('**') && part.endsWith('**') && part.length > 3) out.push(h('strong', null, part.slice(2, -2)));
    else out.push(part);
  }
  return out;
}
function prose(lines) {
  const blocks = []; let cur = [];
  for (const l of lines) {
    const t = l.trim();
    if (t && !/^(-{3,}|\*{3,})$/.test(t)) cur.push(t);
    else if (cur.length) { blocks.push(cur); cur = []; }
  }
  if (cur.length) blocks.push(cur);
  return h('div', { class: 'prose' }, blocks.map(b => {
    if (b.every(l => /^[-*]\s/.test(l))) return h('ul', null, b.map(l => h('li', null, inline(l.replace(/^[-*]\s+/, '')))));
    if (b.every(l => l.startsWith('>'))) return h('p', { class: 'sub' }, inline(b.map(l => l.replace(/^>\s?/, '')).join(' ')));
    return h('p', null, inline(b.join(' ')));
  }));
}

// ---------------------------------------------------------------- parser
function parseNodeLine(body) {
  let async = false, cond = null, m;
  for (;;) {
    if (body.startsWith('~')) { async = true; body = body.slice(1).trim(); continue; }
    if ((m = body.match(/^\[if\s+([^\]]*)\]\s*/i))) { cond = m[1].trim(); body = body.slice(m[0].length); continue; }
    if ((m = body.match(/^\[else\]\s*/i))) { cond = 'else'; body = body.slice(m[0].length); continue; }
    break;
  }
  let note = '';
  const nm = body.match(/\s+(?:—|–|--)\s+(.*)$/);
  if (nm) { note = nm[1].trim(); body = body.slice(0, nm.index).trim(); }
  const n = { async, cond, note, kind: 'call', path: '', symbol: '', label: '', children: [], attrs: {} };
  if (body.startsWith('@')) { n.kind = 'ref'; n.target = body.slice(1).trim(); n.label = n.target; }
  else if ((m = body.match(/^=>\s*(.*)$/))) { n.kind = 'boundary'; n.label = m[1].trim(); }
  else if ((m = body.match(/^(?:→|->)\s*(.*)$/))) { n.kind = 'result'; n.label = m[1].trim(); }
  else if ((m = body.match(new RegExp('^(' + EFFECTS.join('|') + ')\\s*:\\s*(.*)$', 'i')))) { n.kind = 'effect'; n.effect = m[1].toLowerCase(); n.label = m[2].trim(); }
  else if ((m = body.match(/^(.*?)\s*::\s*(.*)$/))) { n.path = m[1].trim(); n.symbol = m[2].trim(); }
  else { n.symbol = body; }
  return n;
}

function parseDoc(text) {
  const lines = text.split(/\r?\n/);
  const doc = { title: '', intro: [], overview: null, flows: [], keyFiles: [], other: [], layers: [], lint: [], lineCount: lines.length, raw: text, legacy: false };
  const lint = (sev, msg, line) => doc.lint.push({ sev, msg, line });
  let sec = null, fence = null;

  const closeFence = () => {
    const f = fence; fence = null;
    if (f.lang === 'flow') {
      if (!sec || sec.type !== 'flow') { lint('warn', 'A ```flow block sits outside a "## Flow:" section and was ignored', f.start); return; }
      parseFlowBlock(f, sec);
    } else if (f.lang === 'components') {
      if (!sec || sec.type !== 'overview') { lint('warn', 'A ```components block belongs under "## Overview"', f.start); return; }
      parseComponents(f, sec);
    } else if (f.lang === 'layers') {
      if (sec && sec.type === 'flow') { lint('warn', 'A ```layers block belongs under "## Overview"', f.start); return; }
      parseLayers(f);
    } else if (sec && (sec.type === 'overview' || sec.type === 'other')) {
      sec.code.push(f.lines.map(l => l.text).join('\n'));
    }
  };

  const parseFlowBlock = (f, flow) => {
    flow.hasBlock = true;
    const stack = [];
    let prev = null, pendingPhase = null;
    for (const { text: t, no } of f.lines) {
      const raw = t.replace(/\t/g, '  ');
      let body = raw.trim();
      if (!body || body.startsWith('#')) continue;
      body = body.replace(/\s+#\s.*$/, '').trim();
      if (!body) continue;

      // "| key: value" — an attribute of the step above. Doesn't count toward the budget.
      if (body.startsWith('|')) {
        const am = body.match(/^\|\s*([\w-]+)\s*:\s*(.*)$/);
        if (!am) { lint('warn', 'Malformed attribute — use "| plain: …", "| passes: …" or "| fails: …"', no); continue; }
        const key = am[1].toLowerCase(), val = am[2].trim();
        if (!ATTRS.includes(key)) { lint('warn', `Unknown attribute "${key}" — use plain, passes or fails`, no); continue; }
        if (!prev) { lint('warn', `"| ${key}:" has no step above it`, no); continue; }
        if (prev.attrs[key]) lint('info', `Second "${key}" for the same step — joined to the first`, no);
        prev.attrs[key] = prev.attrs[key] ? prev.attrs[key] + ' ' + val : val;
        if (val.length > LIMITS[key]) lint('warn', `"${key}" is ${val.length} chars (limit ${LIMITS[key]})`, no);
        if (HISTORY_RE.test(val)) lint('warn', `History/changelog wording: "${val.match(HISTORY_RE)[0]}" — flow.md describes the current code only`, no);
        if (key === 'plain' && IDENT_RE.test(val)) lint('info', `Plain English contains code ("${val.match(IDENT_RE)[0]}") — say it without identifiers`, no);
        continue;
      }
      // "== Name — subtitle" — starts a phase. Doesn't count toward the budget.
      if (/^==(?!>)/.test(body)) {
        const ph = body.replace(/^=+\s*/, '').replace(/\s*=+$/, '');
        const pm = ph.match(/^(.*?)\s+(?:—|–|--)\s+(.*)$/);
        const name = (pm ? pm[1] : ph).trim();
        if (!name) { lint('warn', 'Phase line has no name — use "== Name — subtitle"', no); continue; }
        if (pendingPhase) lint('info', `Phase "${pendingPhase.name}" has no steps`, pendingPhase.line);
        if (HISTORY_RE.test(ph)) lint('warn', `History/changelog wording in a phase: "${ph.match(HISTORY_RE)[0]}"`, no);
        pendingPhase = { name, sub: pm ? pm[2].trim() : '', line: no };
        continue;
      }

      flow.blockLines++;
      const indent = raw.match(/^ */)[0].length;
      if (indent % 2) lint('warn', 'Indent is not a multiple of 2 spaces', no);
      const n = parseNodeLine(body);
      n.line = no; n.raw = body;
      if (pendingPhase) { n.phaseStart = pendingPhase; pendingPhase = null; }
      while (stack.length && stack[stack.length - 1].indent >= indent) stack.pop();
      const top = stack[stack.length - 1];
      if (top && indent - top.indent > 2) lint('info', 'Indent jumps more than one level', no);
      n.parent = top ? top.node : null;
      n.depth = n.parent ? n.parent.depth + 1 : 0;
      if (n.kind === 'call' && !n.path) {
        let a = n.parent; while (a && !(a.kind === 'call' && a.path)) a = a.parent;
        if (a) { n.path = a.path; n.inherited = true; }
      }
      (n.parent ? n.parent.children : flow.roots).push(n);
      stack.push({ indent, node: n });
      prev = n;
      if (n.note.length > LIMITS.note) lint('warn', `Note is ${n.note.length} chars (limit ${LIMITS.note}) — keep notes to what the hop does`, no);
      if (HISTORY_RE.test(body)) lint('warn', `History/changelog wording: "${body.match(HISTORY_RE)[0]}" — flow.md describes the current code only`, no);
    }
    if (pendingPhase) lint('info', `Phase "${pendingPhase.name}" has no steps`, pendingPhase.line);
  };

  const parseComponents = (f, ov) => {
    for (const { text: t, no } of f.lines) {
      let l = t.replace(/\s+#\s.*$/, '').trim();
      if (!l || l.startsWith('#')) continue;
      const m = l.match(/^(.*?)\s*(<->|->|→)\s*(.*)$/);
      if (!m) { ov.nodes.push(l); continue; }
      let b = m[3], label = '';
      const lm = b.match(/^(.*?)\s*:\s*(.*)$/);
      if (lm) { b = lm[1]; label = lm[2]; }
      if (!m[1].trim() || !b.trim()) { lint('warn', 'Malformed components edge', no); continue; }
      ov.edges.push({ a: m[1].trim(), b: b.trim(), label: label.trim(), both: m[2] === '<->' });
    }
  };

  const parseLayers = (f) => {
    for (const { text: t, no } of f.lines) {
      const l = t.replace(/\s+#\s.*$/, '').trim();
      if (!l || l.startsWith('#')) continue;
      const m = l.match(/^(.*?)\s*:\s*(.*)$/);
      const name = (m ? m[1] : l).trim();
      if (!name) { lint('warn', 'Malformed layers line — use "Name : path/prefix, other/prefix"', no); continue; }
      const prefixes = m ? m[2].split(',').map(p => p.trim().replace(/^`|`$/g, '').replace(/^\.\//, '').replace(/\/+$/, '')).filter(Boolean) : [];
      if (doc.layers.some(x => x.name === name)) lint('warn', `Duplicate layer "${name}"`, no);
      if (!prefixes.length) lint('warn', `Layer "${name}" has no path prefixes, so no step can land in it`, no);
      doc.layers.push({ name, prefixes, line: no });
    }
  };

  let inComment = false;
  const content = []; // lines under ## sections, minus comments — what legacy detection scans
  for (let i = 0; i < lines.length; i++) {
    let ln = lines[i]; const no = i + 1;
    if (fence) {
      if (/^\s*```+\s*$/.test(ln)) closeFence();
      else { fence.lines.push({ text: ln, no }); if (sec) content.push({ text: ln, no }); }
      continue;
    }
    // Strip HTML comments (template guidance) outside fences. The markers are written
    // as \x escapes: a literal open/close marker inside <script> confuses HTML parsers.
    if (inComment) { const e = ln.indexOf('--\x3e'); if (e < 0) continue; ln = ln.slice(e + 3); inComment = false; }
    ln = ln.replace(/\x3c!--.*?--\x3e/g, '');
    const cs = ln.indexOf('\x3c!--'); if (cs >= 0) { inComment = true; ln = ln.slice(0, cs); }
    if (sec) content.push({ text: ln, no });
    let m;
    if ((m = ln.match(/^\s*```+\s*([\w-]*)/))) { fence = { lang: m[1].toLowerCase(), start: no, lines: [] }; continue; }
    if ((m = ln.match(/^#\s+(.*)/)) && !doc.title) { doc.title = m[1].trim(); continue; }
    if ((m = ln.match(/^##\s+(.*)/))) {
      const head = m[1].trim(); let fm;
      if (/^overview\b/i.test(head)) { sec = { type: 'overview', title: head, text: [], code: [], edges: [], nodes: [], line: no }; doc.overview = sec; }
      else if ((fm = head.match(/^flow\s*:\s*(.*?)\s*(?:\{#([\w-]+)\})?\s*$/i))) {
        sec = { type: 'flow', name: fm[1] || 'Untitled', id: fm[2] || '', trigger: '', text: [], roots: [], blockLines: 0, line: no, hasBlock: false };
        if (!fm[2]) lint('info', `Flow "${sec.name}" has no {#id}; using #${slug(sec.name)}`, no);
        doc.flows.push(sec);
      }
      else if (/^key\s*files/i.test(head)) { sec = { type: 'keyfiles', line: no, header: false }; }
      else { sec = { type: 'other', title: head, text: [], code: [], line: no }; doc.other.push(sec); }
      continue;
    }
    if (!sec) { doc.intro.push(ln); continue; }
    if (sec.type === 'flow') {
      if ((m = ln.match(/^\s*trigger\s*:\s*(.*)/i))) { sec.trigger = m[1].trim(); sec.triggerLine = no; }
      else if (ln.trim()) sec.text.push(ln);
    } else if (sec.type === 'keyfiles') {
      if (!/^\s*\|/.test(ln)) continue;
      const cells = ln.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      if (cells.every(c => /^:?-+:?$/.test(c))) continue;
      if (!sec.header) { sec.header = true; continue; }
      const row = { concern: cells[0], files: cells.slice(1).join(' | '), line: no };
      doc.keyFiles.push(row);
      const paths = (row.files.match(/`[^`]+`/g) || []).length;
      if (paths > LIMITS.keyPaths) lint('warn', `Key files row "${row.concern}" lists ${paths} paths (limit ${LIMITS.keyPaths})`, no);
      if (row.files.length > LIMITS.keyRowChars) lint('warn', `Key files row "${row.concern}" reads like prose — paths only`, no);
      if (HISTORY_RE.test(ln)) lint('warn', `History/changelog wording in Key files: "${ln.match(HISTORY_RE)[0]}"`, no);
    } else {
      sec.text.push(ln);
    }
  }
  if (fence) lint('error', 'Unclosed code fence', fence.start);

  // ids, indexes, refs
  const seen = new Set();
  for (const f of doc.flows) {
    let id = f.id || slug(f.name);
    if (seen.has(id)) { lint('warn', `Duplicate flow id #${id}`, f.line); let k = 2; while (seen.has(id + '-' + k)) k++; id = id + '-' + k; }
    seen.add(id); f.id = id;
    if (!f.hasBlock) lint('warn', `Flow "${f.name}" has no \`\`\`flow block`, f.line);
    if (!f.trigger) lint('info', `Flow "${f.name}" has no "Trigger:" line`, f.line);
    if (f.blockLines > LIMITS.flowLines) lint('warn', `Flow "${f.name}" is ${f.blockLines} lines (budget ${LIMITS.flowLines}) — split a sub-flow out and link it with @id`, f.line);
    if (f.trigger && HISTORY_RE.test(f.trigger)) lint('warn', `History wording in trigger of "${f.name}"`, f.triggerLine);
  }

  }
  svg.append(g); box.append(svg, h('div', { class: 'graphhint' }, 'drag to pan · wheel to zoom · double-click to fold'));

  const bboxW = acc - GAPX, bboxH = leafY;
  const view = () => S.views[f.id];
  const apply = () => { const v = view(); g.setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.k})`); };
  requestAnimationFrame(() => {
    if (!view()) {
      // First view keeps text legible (k ≥ 0.6, pan for the rest); the Fit button fits exactly.
      const r = svg.getBoundingClientRect();
      const fit = Math.min(1, (r.width - 40) / Math.max(bboxW, 1), (r.height - 40) / Math.max(bboxH, 1));
      const k = S.fitExact ? Math.max(fit, 0.15) : Math.max(fit, 0.6);
      S.fitExact = false;
      S.views[f.id] = { k, x: 20, y: Math.max(20, (r.height - bboxH * k) / 2) };
    }
    apply();
  });
  svg.addEventListener('wheel', (e) => {
    e.preventDefault();
    const v = view(); if (!v) return;
    const r = svg.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const k2 = Math.min(3, Math.max(0.15, v.k * Math.exp(-e.deltaY * 0.0015)));
    v.x = mx - (mx - v.x) * k2 / v.k; v.y = my - (my - v.y) * k2 / v.k; v.k = k2; apply();
  }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', (e) => { const v = view(); if (!v) return; drag = { sx: e.clientX, sy: e.clientY, x: v.x, y: v.y }; svg.dataset.moved = '0'; });
  svg.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (svg.dataset.moved === '0' && Math.hypot(dx, dy) < 4) return;
    if (svg.dataset.moved === '0') { svg.dataset.moved = '1'; svg.classList.add('drag'); svg.setPointerCapture(e.pointerId); }
    const v = view(); v.x = drag.x + dx; v.y = drag.y + dy; apply();
  });
  const end = () => { drag = null; svg.classList.remove('drag'); setTimeout(() => { svg.dataset.moved = '0'; }, 0); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  return box;
}
function centerOn(n) {
  const svg = document.querySelector('.graphbox svg'); if (!svg || !lastLayout) return;
  const it = lastLayout.at.get(n); if (!it) return;
  const v = S.views[n.flow.id]; if (!v) return;
  const r = svg.getBoundingClientRect();
  v.x = r.width / 2 - (lastLayout.colX[it.d] + it.w / 2) * v.k;
  v.y = r.height / 2 - (it.y + lastLayout.BH / 2) * v.k;
  svg.querySelector('g').setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.k})`);
}

// ---- files
function renderFiles() {
  const d = S.doc;
  const wrap = h('div', null, h('h2', null, 'Files'), h('p', { class: 'sub' }, 'Every file that appears in a flow, and where.'));
  if (d.keyFiles.length) {
    wrap.append(h('h3', null, 'Key files'), h('table', null,
      h('tr', null, h('th', null, 'Concern'), h('th', null, 'Files')),
      d.keyFiles.map(r => h('tr', null, h('td', null, inline(r.concern)), h('td', null, inline(r.files))))));
  }
  const paths = [...d.files.keys()].sort((a, b) => layerOf(d, a).idx - layerOf(d, b).idx || a.localeCompare(b));
  wrap.append(h('h3', null, 'All traced files (' + paths.length + ')'));
  wrap.append(h('table', null, h('tr', null, h('th', null, 'File'), h('th', null, 'Layer'), h('th', null, 'Used in')), paths.map(p => {
    const byFlow = new Map();
    for (const n of d.files.get(p)) { if (!byFlow.has(n.flow)) byFlow.set(n.flow, []); byFlow.get(n.flow).push(n); }
    return h('tr', null,
      h('td', { class: 'mono', style: `border-left:3px solid ${dirVar(p)}` }, p),
      h('td', null, layerOf(d, p).name),
      h('td', null, [...byFlow].map(([fl, ns]) => h('span', { class: 'chip', title: [...new Set(ns.map(n => n.symbol))].join(', '), onclick: () => goToNode(ns[0]) }, fl.name + ' · ' + [...new Set(ns.map(n => n.symbol))].slice(0, 3).join(', ') + (ns.length > 3 ? '…' : '')))));
  })));
  return wrap;
}

// ---- lint
function renderLint() {
  const d = S.doc;
  const wrap = h('div', null, h('h2', null, 'Lint'),
    h('p', { class: 'sub' }, `Checks flow.md against the brain-docs format: current state only, notes ≤ ${LIMITS.note} chars, flows ≤ ${LIMITS.flowLines} lines, plain ≤ ${LIMITS.plain} / passes ≤ ${LIMITS.passes} / fails ≤ ${LIMITS.fails} chars, valid @refs.`));
  if (!d.lint.length) { wrap.append(h('p', null, '✓ No issues.')); return wrap; }
  wrap.append(h('ul', { class: 'lint' }, d.lint.map(l => h('li', null, h('span', { class: 'sev ' + l.sev }, l.sev), h('span', null, l.msg), h('span', { class: 'ln' }, 'line ' + l.line)))));
  return wrap;
}

// ---- detail panel
let detailToken = 0;
function renderDetails() {
  const box = $('#details'), f = curFlow(), tok = ++detailToken;
  box.replaceChildren();
  box.classList.toggle('sheet-open', S.sheet);
  if (!f) { box.hidden = true; return; }
  box.hidden = false;
  box.append(h('button', { class: 'btn close', onclick: () => { S.sheet = false; renderDetails(); }, 'aria-label': 'Close details' }, '✕'));
  const n = S.sel || f.steps[S.cursor];
  if (!n) { box.append(h('p', { class: 'nosel' }, 'Select a step to see what it does.')); return; }
  const st = stepOf(n), isStep = n.step != null, layer = st ? st.layer : S.doc.layers[0];
  box.style.setProperty('--h', layer.hue);
  box.append(h('div', { class: 'dmeta' },
    h('span', { class: 'badge' }, layer.name),
    h('span', { class: 'sn2' }, isStep ? `step ${n.step + 1} of ${f.steps.length}` : KIND[n.kind] + (st ? ` · in step ${st.step + 1}` : '')),
    n.cond && h('span', { class: 'tag2 cond', title: n.cond }, n.cond === 'else' ? 'else' : 'if ' + n.cond),
    n.async && h('span', { class: 'tag2 async' }, 'async')));
  box.append(h('h3', { class: 'dh' }, boxText(n)[0]));
  if (n.path) box.append(h('button', { class: 'dpath', title: 'Copy path', onclick: (e) => { try { navigator.clipboard.writeText(n.path); e.currentTarget.textContent = n.path + '  ✓ copied'; } catch (err) { /* ignore */ } } }, n.path));

  const ref = n.kind === 'ref';
  const plain = n.attrs.plain || (ref ? `Continues in the “${n.targetFlow ? n.targetFlow.name : n.target}” trace.` : n.note);
  const tech = (n.attrs.plain || ref) && n.note ? n.note : '';
  if (plain) box.append(h('div', { class: 'plainbox' }, h('div', { class: 'lab' }, 'In plain English'), h('p', null, inline(plain))));
  if (tech) box.append(h('p', { class: 'tech' }, inline(tech)));
  if (n.kind === 'boundary') box.append(h('p', { class: 'tech' }, 'Process / network boundary — everything below it runs on the other side.'));
  if (n.kind === 'effect') box.append(h('p', { class: 'tech' }, `Side effect (${n.effect}) of the step above.`));
  if (n.kind === 'result') box.append(h('p', { class: 'tech' }, 'What the step above returns or responds with.'));
  if (n.attrs.fails) box.append(h('div', { class: 'fail' }, h('span', { class: 'lab' }, 'If it fails'), h('p', null, inline(n.attrs.fails))));

  const dsec = (label, aux, ...kids) => h('div', { class: 'dsec' }, h('div', { class: 'rule' }, h('span', { class: 'lab' }, label), h('span', { class: 'ln' }), aux), kids);
  const chip = (m, label) => h('button', { class: 'chip2', style: `--h:${hueOf(m)}`, title: label, onclick: () => pickNode(m) }, h('i', { class: 'dot' }), h('span', null, label));
  const passes = isStep ? n.passes : n.attrs.passes;
  if (passes) box.append(dsec('Passes on', null, h('div', { class: 'pass' }, passes)));
  if (isStep && n.effects.length) box.append(dsec('Side effects', null, n.effects.map(e => chip(e, e.effect + ': ' + e.label))));
  if (ref && n.targetFlow) box.append(dsec('Continues in', null, h('button', { class: 'chip2', style: `--h:${n.targetFlow.steps[0] ? n.targetFlow.steps[0].layer.hue : HUES[0]}`, onclick: () => go('flow', n.target) }, h('i', { class: 'dot' }), h('span', null, n.targetFlow.name + '  →'))));

  if (n.path && n.kind === 'call' && SERVED) {
    const pre = h('pre', { class: 'src' }, 'loading…'), where = h('span', { class: 'aux' });
    const sec = dsec('Source', [where, ' ', h('a', { href: srcUrl(n.path), target: '_blank', rel: 'noopener' }, 'open file ↗')], pre);
    box.append(sec);
    loadSource(n.path).then(txt => {
      if (tok !== detailToken) return;
      if (txt == null) { sec.remove(); return; }
      const ex = excerpt(txt, n.symbol);
      pre.textContent = ex.text || '(empty file)';
      where.textContent = ex.found ? 'L' + ex.line : 'symbol not found · top of file';
    });
  }

  const calls = isStep ? n.subSteps : [];
  const calledBy = st ? (isStep ? (n.stepParent ? [n.stepParent] : (n.step === 0 ? S.doc.refsTo.get(f.id) || [] : [])) : [st]) : [];
  const col = (label, list) => h('div', null, h('div', { class: 'rule' }, h('span', { class: 'lab' }, `${label} (${list.length})`)),
    list.length ? list.map(m => chip(m, m.flow !== f ? m.flow.name + ' · ' + boxText(m.stepParent || m)[0] : boxText(m)[0])) : h('div', { class: 'none' }, '—'));
  box.append(h('div', { class: 'cc' }, col('Calls', calls), col('Called by', calledBy)));

  if (n.kind === 'call' && n.path) {
    const others = [];
    for (const m of S.doc.nodes.values()) if (m !== n && m.flow !== f && m.kind === 'call' && m.path === n.path && m.symbol === n.symbol) others.push(m);
    if (others.length) box.append(dsec('Also in', null, others.map(m => chip(m, m.flow.name + ' · step ' + (stepIndexOf(m) + 1)))));
  }
  box.append(h('div', { class: 'dfoot' }, `flow.md line ${n.line} · ${f.name}`));
}

// ---------------------------------------------------------------- palette (⌘K)
function openPalette() {
  if (!S.doc) return;
  if (S.pal) { S.pal.input.focus(); return; }
  const input = h('input', { type: 'text', placeholder: 'Jump to a function, file, or what it does…', 'aria-label': 'Jump to', autocomplete: 'off', spellcheck: 'false' });
  const res = h('div', { class: 'res', role: 'listbox' });
  const bg = h('div', { class: 'pal-bg' }, h('div', { class: 'pal', role: 'dialog', 'aria-label': 'Jump to' }, input, res, h('div', { class: 'foot' }, '↑↓ move · Enter jump · Esc close')));
  bg.addEventListener('mousedown', (e) => { if (e.target === bg) closePalette(); });
  document.body.append(bg);
  S.pal = { bg, input, res, items: [], i: 0 };
  input.addEventListener('input', () => { S.pal.i = 0; paintPalette(); });
  input.addEventListener('keydown', (e) => {
    const p = S.pal;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); p.i = clamp(p.i + (e.key === 'ArrowDown' ? 1 : -1), 0, Math.max(0, p.items.length - 1)); markPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); const it = p.items[p.i]; if (it) choose(it); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePalette(); }
  });
  paintPalette(); input.focus();
}
function closePalette() { if (S.pal) { S.pal.bg.remove(); S.pal = null; } }
function choose(it) { closePalette(); if (it.flow) go('flow', it.flow.id); else goToNode(it.node); }
function paletteHits(q) {
  const d = S.doc, terms = q.toLowerCase().split(/\s+/).filter(Boolean), f = curFlow();
  if (!terms.length) return [...d.flows.map(fl => ({ flow: fl })), ...(f ? f.steps.slice(0, 40).map(n => ({ node: n })) : [])];
  const has = (str) => { const l = str.toLowerCase(); return terms.every(t => l.includes(t)); };
  const out = [];
  for (const fl of d.flows) if (has([fl.name, fl.trigger, fl.id].join(' '))) out.push({ flow: fl, score: 10 });
  for (const n of d.nodes.values()) {
    if (!has([n.symbol, n.path, n.label, n.note, n.effect, ...Object.values(n.attrs)].join(' '))) continue;
    const sym = (n.symbol || n.label).toLowerCase();
    let score = n.step != null ? 2 : 0;
    for (const t of terms) score += sym.startsWith(t) ? 4 : sym.includes(t) ? 3 : (n.path || '').toLowerCase().includes(t) ? 1 : 0;
    if (n.flow === f) score += 0.5;
    out.push({ node: n, score });
  }
  return out.sort((a, b) => b.score - a.score).slice(0, 60);
}
function paintPalette() {
  const p = S.pal, d = S.doc;
  p.items = paletteHits(p.input.value);
  // Group by layer (flows first), keeping score order inside each group.
  const groups = new Map();
  for (const it of p.items) {
    const key = it.flow ? 'Traces' : (stepOf(it.node) || { layer: d.layers[0] }).layer;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  const keys = [...groups.keys()].sort((a, b) => (a === 'Traces' ? -1 : a.idx) - (b === 'Traces' ? -1 : b.idx));
  p.items = keys.flatMap(k => groups.get(k));
  p.res.replaceChildren();
  if (!p.items.length) { p.res.append(h('div', { class: 'grp none' }, 'No matches.')); return; }
  let i = 0;
  for (const k of keys) {
    p.res.append(h('div', { class: 'grp' }, k !== 'Traces' && h('i', { class: 'dot', style: `--h:${k.hue}` }), h('span', { class: 'lab' }, k === 'Traces' ? 'Traces' : k.name)));
    for (const it of groups.get(k)) {
      const idx = i++, n = it.node;
      const a = it.flow ? it.flow.name : boxText(n)[0];
      const b = it.flow ? (it.flow.trigger || it.flow.steps.length + ' steps')
        : [n.attrs.plain || n.note, n.path, n.flow.name + (n.step != null ? ' · step ' + (n.step + 1) : '')].filter(Boolean).join(' · ');
      p.res.append(h('div', { class: 'it', role: 'option', 'data-i': idx, onmousemove: () => { if (p.i !== idx) { p.i = idx; markPalette(); } }, onclick: () => choose(it) },
        h('div', { class: 'a' }, a), h('div', { class: 'b' }, b)));
    }
  }
  markPalette();
}
function markPalette() {
  const p = S.pal;
  for (const el of p.res.querySelectorAll('.it')) {
    const on = +el.dataset.i === p.i;
    el.classList.toggle('on', on);
    el.setAttribute('aria-selected', String(on));
    if (on) { const r = el.getBoundingClientRect(), rr = p.res.getBoundingClientRect(); if (r.bottom > rr.bottom || r.top < rr.top) p.res.scrollTop += r.top - rr.top - rr.height / 2; }
  }
}

// ---------------------------------------------------------------- chrome
$('#openBtn').onclick = openFile;
$('#jumpBtn').onclick = openPalette;
$('#reloadBtn').onclick = async () => {
  if (!S.src) return;
  if (S.src.kind === 'handle') { const f = await S.src.handle.getFile(); S.src.lastMod = f.lastModified; setText(await f.text()); }
  else if (S.src.kind === 'url') loadFromUrl();
};
$('#menuBtn').onclick = () => $('#side').classList.toggle('open');
document.addEventListener('keydown', (e) => {
  if (S.pal) return;
  if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); openPalette(); return; }
  const el = document.activeElement;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') {
    if (S.sel) { S.sel = null; update(null); }
    else if (S.sheet) { S.sheet = false; renderDetails(); }
    return;
  }
  if (!traceOn()) return;
  if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); moveCursor(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); moveCursor(-1); }
  else if (e.key === ']') jumpPhase(1);
  else if (e.key === '[') jumpPhase(-1);
  else if (e.key === 'p') togglePresent();
});

// ---------------------------------------------------------------- boot
(async function boot() {
  parseHash();
  if (SERVED && await loadFromUrl()) return;
  const saved = await idb.get(IDB_KEY);
  if (saved && saved.queryPermission) {
    try {
      if ((await saved.queryPermission({ mode: 'read' })) === 'granted') { await useHandle(saved); return; }
      S.pendingHandle = saved;
    } catch (e) { /* stale handle */ }
  }
  render();
})();
})();
</script>
